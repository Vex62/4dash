/** Para edición continua (teclear): un único paso de historial por ráfaga. */
const endTyping = debounce(() => { App.typingSnap = null; }, 900);
function mutateTyping(fn, opts = {}) {
  if (!App.typingSnap) { App.typingSnap = snapshot(); pushHistory(App.typingSnap); }
  fn();

}
function restore(json) {
  const o = safeJsonParse(json);
  App.p.pages = o.pages.map(sanitizePage).filter(Boolean);
  App.p.title = str(o.title, 120, App.p.title);
  App.p.active = App.p.pages.some(p => p.id === o.active) ? o.active : App.p.pages[0].id;
  if (!selW()) App.sel = null;

}
function undo() { if (!App.hist.length) return; App.fut.push(snapshot()); restore(App.hist.pop()); }

  App.p.filters = App.p.filters.filter(f => !(f.ds === dsId && f.field === field));

  const cur = getFilter(dsId, field);

  } else {

/* ---------- Interacción: mover y redimensionar ---------- */
function onWidgetPointerDown(e, w, el) {
  if (App.view !== 'editor' || e.button !== 0) return;
  if (e.target.closest('.w-actions, input, textarea, select, button, .tbl-wrap, .slicer-list, .slicer-tiles')) {
    if (App.sel !== w.id) select(w.id);
    if (e.target.closest('.tbl-wrap, .slicer-list, .slicer-tiles')) App.armed = w.id;
    return;
  }
  const handle = e.target.closest('.handle');
  const wasSelected = App.sel === w.id;
  if (!wasSelected) select(w.id);
  App.armed = wasSelected && !handle ? w.id : null;
  const mode = handle ? handle.dataset.dir : 'move';
  const start = { x: e.clientX, y: e.clientY, gx: w.x, gy: w.y, gw: w.w, gh: w.h };
  const pg = page();
  const others = pg.widgets.filter(o => o.id !== w.id);
  const snap0 = snapshot();
  let moving = false, badge = null, raf = 0;
  const guidesRoot = $('#page');
  const clearGuides = () => guidesRoot.querySelectorAll('.guide').forEach(g => g.remove());
  const onMove = ev => {
    const dx = (ev.clientX - start.x) / App.scale, dy = (ev.clientY - start.y) / App.scale;
    if (!moving) {
      if (Math.abs(ev.clientX - start.x) + Math.abs(ev.clientY - start.y) < 4) return;
      moving = true; App.armed = null; Tip.hide();
      el.classList.add('dragging');
      badge = h('div', { class: 'size-badge' });
      el.appendChild(badge);
    }
    ev.preventDefault();
    const doSnap = App.p.snap && !ev.altKey;
    const sn = v => (doSnap ? Math.round(v / GRID) * GRID : Math.round(v));
    let { gx: x, gy: y, gw: ww, gh: hh } = start;
    if (mode === 'move') { x = sn(start.gx + dx); y = sn(start.gy + dy); }
    else {
      if (mode.includes('e')) ww = sn(start.gx + start.gw + dx) - x;
      if (mode.includes('s')) hh = sn(start.gy + start.gh + dy) - y;
      if (mode.includes('w')) { const nx = sn(start.gx + dx); ww = start.gx + start.gw - nx; x = nx; }
      if (mode.includes('n')) { const ny = sn(start.gy + dy); hh = start.gy + start.gh - ny; y = ny; }
      if (ww < 80) { if (mode.includes('w')) x -= 80 - ww; ww = 80; }
      if (hh < 60) { if (mode.includes('n')) y -= 60 - hh; hh = 60; }
    }
    // Guías inteligentes de alineación
    clearGuides();
    if (mode === 'move' && !ev.altKey) {
      const tol = 6 / App.scale;
      const xs = [0, pg.w / 2, pg.w], ys = [0, pg.h / 2, pg.h];
      for (const o of others) { xs.push(o.x, o.x + o.w / 2, o.x + o.w); ys.push(o.y, o.y + o.h / 2, o.y + o.h); }
      let bestX = null, bestY = null;
      for (const [off] of [[0], [ww / 2], [ww]]) for (const gxv of xs) { const d = gxv - (x + off); if (Math.abs(d) <= tol && (!bestX || Math.abs(d) < Math.abs(bestX.d))) bestX = { d, at: gxv }; }
      for (const [off] of [[0], [hh / 2], [hh]]) for (const gyv of ys) { const d = gyv - (y + off); if (Math.abs(d) <= tol && (!bestY || Math.abs(d) < Math.abs(bestY.d))) bestY = { d, at: gyv }; }
      if (bestX) { x += bestX.d; const g = h('div', { class: 'guide v' }); g.style.left = bestX.at + 'px'; guidesRoot.appendChild(g); }
      if (bestY) { y += bestY.d; const g = h('div', { class: 'guide h' }); g.style.top = bestY.at + 'px'; guidesRoot.appendChild(g); }
    }
    x = clamp(x, 0, Math.max(0, pg.w - ww));
    y = clamp(y, 0, Math.max(0, pg.h - Math.min(hh, pg.h)));
    ww = Math.min(ww, pg.w);
    Object.assign(w, { x: Math.round(x), y: Math.round(y), w: Math.round(ww), h: Math.round(hh) });
    Object.assign(el.style, { left: w.x + 'px', top: w.y + 'px', width: w.w + 'px', height: w.h + 'px' });
    badge.textContent = mode === 'move' ? `X ${w.x} · Y ${w.y}` : `${w.w} × ${w.h}`;
    if (mode !== 'move' && !raf) {
      raf = requestAnimationFrame(() => {
        raf = 0;
        const body = el.querySelector('.w-body');
        const { W, H } = bodySize(w);
        renderVisual(w, body, widgetCtx(w, W, H));
      });
    }
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    if (raf) cancelAnimationFrame(raf);
    clearGuides();
    if (moving) {
      el.classList.remove('dragging');
      if (badge) badge.remove();
      if (w.y + w.h > pg.h && pg.size !== 'custom' && mode !== 'move') { /* se permite sobresalir: el usuario puede ajustar la página */ }
      pushHistory(snap0);
      afterChange({ only: 'widget', w });
    }
    setTimeout(() => { if (App.armed === w.id && !moving) { /* el clic ya se procesó */ } App.armed = null; }, 0);
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}

/* ---------- Acciones sobre widgets ---------- */
function findFreeSpot(pg, ww, hh) {
  const fits = (x, y) => x + ww <= pg.w && y + hh <= pg.h && !pg.widgets.some(o => x < o.x + o.w + 8 && x + ww + 8 > o.x && y < o.y + o.h + 8 && y + hh + 8 > o.y);
  for (let y = 16; y + hh <= pg.h; y += 16) for (let x = 16; x + ww <= pg.w; x += 16) if (fits(x, y)) return { x, y };
  const n = pg.widgets.length % 10;
  return { x: 32 + n * 24, y: 32 + n * 24 };
}
function insertWidget(type, at, extra) {
  const pg = page();
  const ds = dsById(fieldsDsId) || App.p.datasets[0] || null;
  const w = newWidget(type, ['text', 'image'].includes(type) ? null : ds, extra);
  if (ds && !extra) defaultFields(w, ds);
  if (type === 'text' && !w.text) w.text = '# Título\nEscribe aquí tu texto.';
  w.w = Math.min(w.w, pg.w - 32);
  const spot = at ? { x: clamp(Math.round((at.x - w.w / 2) / GRID) * GRID, 0, pg.w - w.w), y: clamp(Math.round((at.y - 16) / GRID) * GRID, 0, Math.max(0, pg.h - w.h)) } : findFreeSpot(pg, w.w, w.h);
  Object.assign(w, spot);
  mutate(() => { pg.widgets.push(w); App.sel = w.id; });

  return w;
}
/** Elige campos razonables para un visual nuevo. */
function defaultFields(w, ds) {
  const cols = ds.columns;
  const num = cols.find(c => c.type === 'number' && !c.role);
  const date = cols.find(c => c.type === 'date');
  const text = cols.map((c, i) => ({ c, d: c.type === 'text' ? distinctCount(ds, i, 200) : 0 })).filter(x => x.d >= 2 && x.d <= 50).sort((a, b) => Math.abs(a.d - 6) - Math.abs(b.d - 6))[0];
  const t = w.type;
  if (['column', 'stacked', 'bar', 'pie', 'donut', 'treemap'].includes(t)) { w.cat = (text && text.c.name) || (date && date.name) || null; w.vals = num ? [num.name] : []; }
  else if (['line', 'area'].includes(t)) { w.cat = (date && date.name) || (text && text.c.name) || null; w.vals = num ? [num.name] : []; }
  else if (t === 'kpi' || t === 'gauge') { w.vals = num ? [num.name] : []; }
  else if (t === 'slicer') { w.cat = (text && text.c.name) || (date && date.name) || (cols[0] && cols[0].name); }
  else if (t === 'scatter') { const ns = cols.filter(c => c.type === 'number' && !c.role); w.vals = ns.slice(0, 2).map(c => c.name); }
  if (w.vals[0]) w.agg = pickAgg(w.vals[0]);
  if (t === 'stacked' && text) { const other = cols.find(c => c.type === 'text' && c.name !== w.cat && distinctCount(ds, colIdx(ds, c.name), 20) <= 8); if (other) w.split = other.name; }
}
function changeType(w, t) {
  if (!VIZ[t] || w.type === t) return;
  mutate(() => {
    const ds = dsById(w.ds);
    w.type = t;
    if (!VIZ[t].split) w.split = null;
    if (VIZ[t].vals === 'num1' || VIZ[t].vals === 'xy') {
      const nums = ds ? ds.columns.filter(c => c.type === 'number').map(c => c.name) : [];
      w.vals = VIZ[t].vals === 'xy' ? Array.from(new Set(w.vals.concat(nums))).filter(v => nums.includes(v)).slice(0, 2) : w.vals.slice(0, 1);
    }
    if (ds && !w.cat && VIZ[t].cat && t !== 'kpi' && t !== 'table' && t !== 'scatter') {
      const tmp = newWidget(t, ds); defaultFields(tmp, ds); w.cat = tmp.cat;
    }
    if (t === 'kpi' && w.cat && colOf(ds, w.cat) && colOf(ds, w.cat).type !== 'date') w.cat = null;
    const [dw, dh] = DEFAULT_SIZE[t] || [w.w, w.h];

}
function dropFieldOnWidget(w, dsId, col) {
  const ds = dsById(dsId);

  if (w.ds !== dsId) {
    mutate(() => { w.ds = dsId; w.cat = null; w.split = null; w.vals = []; });
  }
  const def = VIZ[w.type];
  upd(w, x => {
    const isNum = c.type === 'number' && !c.role;
    if (w.type === 'slicer') return { cat: col };
    if (def.vals === 'any' && !(c.type !== 'number' && !x.cat && false)) return { vals: x.vals.includes(col) ? x.vals : x.vals.concat([col]) };
    if (def.vals === 'xy') { if (!isNum) return { cat: col }; const v = x.vals.slice(0, 2); if (v.length < 2) v.push(col); else v[1] = col; return { vals: v }; }
    if (isNum && def.vals === 'num1') return { vals: [col], agg: x.agg === 'count' ? pickAgg(col) : x.agg };
    if (isNum && def.vals === 'num') return { vals: x.split ? [col] : (x.vals.includes(col) ? x.vals : x.vals.concat([col]).slice(0, 8)), agg: x.vals.length ? x.agg : pickAgg(col) };
    if (w.type === 'kpi' || w.type === 'gauge') return c.type === 'date' && w.type === 'kpi' ? { cat: col } : { vals: [col], agg: 'distinct' };
    if (def.cat && !x.cat) return { cat: col };
    if (def.split && x.cat && x.cat !== col && c.type !== 'number') return { split: col, vals: x.vals.slice(0, 1) };
    return { cat: col };

}

  fieldsDsId = dsId;
  const num = ds.columns.find(x => x.type === 'number' && !x.role);

  else if (c.type === 'date' || c.role === 'year') { type = num ? 'line' : 'column'; extra = { cat: col, vals: num ? [num.name] : [], agg: num ? pickAgg(num.name) : 'count' }; }

async function handleImport(file) {

  if (use.some(t => t.info.rowTitles)) notes.push('títulos de fila detectados');

function buildPagesFor(tables) {
  const pages = [];
  for (const t of tables.slice(0, 20)) {
    const ds = { id: uid(), name: t.name, columns: t.columns, rows: t.rows, info: t.info, v: 1 };
    App.p.datasets.push(ds);
    if (pages.length >= 12) continue;
    // Tabla cruzada con periodos como columnas: se crea también la versión transpuesta
    let transposed = null;
    if (ds.info.rowTitles && ds.info.periodHeaders) {
      transposed = transposeDataset(ds);
      App.p.datasets.push(transposed);

    const { widgets, height } = autoDashboard(ds, { transposed });
    const pg = { id: uid(), name: t.name.slice(0, 60), size: '16:9', w: 1280, h: 720, widgets };
    fitPage(pg, height);
    pages.push(pg);

    frame.style.height = Math.round(pg.h * scale) + 'px';
    const pe = h('div', { class: 'page' });
    Object.assign(pe.style, { width: pg.w + 'px', height: pg.h + 'px', transform: `scale(${scale})` });
    pg.widgets.forEach((w, i) => pe.appendChild(widgetEl(w, i, { editable: false, print: true })));

/* ==========================================================================
   Editor de datos: ver y modificar celdas, columnas, tipos y orígenes.
   Se trabaja sobre una copia; los cambios se aplican al pulsar «Aplicar».
   ========================================================================== */

function convertValue(v, type) {
  if (v == null || v === '') return null;
  if (type === 'number') {
    if (typeof v === 'number') return v;
    return parseNumberStr(String(v), true);
  }
  if (type === 'date') {
    if (typeof v === 'number') return v > 20000 && v < 80000 ? dateToIso(serialToDate(v, false)) : null;
    const t = String(v);
    return ISO_RE.test(t) ? t : parseDateStr(t);
  }
  return typeof v === 'number' ? String(v) : String(v).slice(0, 2000);
}
function cellDisplay(v, type) {
  if (v == null) return '';
  if (type === 'number') return String(v).replace('.', ',');
  return String(v);
}

function openDataEditor(dsId) {
  if (!App.p.datasets.length) return toast('Todavía no hay datos. Importa un Excel primero.');
  let cur = dsById(dsId) || App.p.datasets[0];
  let work = null, pageNo = 0, query = '', dirty = false;
  const PER = 100;
  const load = ds => {
    work = { id: ds.id, name: ds.name, info: ds.info, columns: ds.columns.map(c => ({ name: c.name, type: c.type, role: c.role, orig: c.name })), rows: ds.rows.map(r => r.slice()) };
    pageNo = 0; query = ''; dirty = false;
  };
  load(cur);

  const tabs = h('div', { class: 'dv-tabs', role: 'tablist' });
  const toolbar = h('div', { class: 'dv-toolbar' });
  const gridWrap = h('div', { class: 'dv-grid-wrap' });

  body.style.display = 'flex'; body.style.flexDirection = 'column'; body.style.padding = '0'; body.style.gap = '8px';
  body.append(tabs, toolbar, gridWrap);
  const pager = h('div', { class: 'pager grow' });
  const cancel = h('button', { class: 'btn', type: 'button', text: 'Cerrar' });
  const apply = h('button', { class: 'btn primary', type: 'button', text: 'Aplicar cambios', disabled: true });
  const m = openModal({ title: 'Datos', cls: 'wide', labelledIcon: 'database', body, foot: h('div', { class: 'modal-foot' }, pager, cancel, apply) });
  const markDirty = () => { dirty = true; apply.disabled = false; };

  const confirmDiscard = async () => !dirty || confirmDialog('Cambios sin aplicar', 'Hay cambios sin aplicar en este origen. ¿Descartarlos?', 'Descartar', true);
  cancel.addEventListener('click', async () => { if (await confirmDiscard()) m.close(); });
  apply.addEventListener('click', () => { applyWork(); });

  function drawTabs() {
    clear(tabs);
    for (const d of App.p.datasets) {
      const t = h('button', { class: 'tab', type: 'button', role: 'tab', 'aria-selected': d.id === work.id ? 'true' : 'false', text: d.name });
      t.addEventListener('click', async () => { if (d.id === work.id || !await confirmDiscard()) return; cur = d; load(d); drawAll(); });
      tabs.appendChild(t);
    }
  }
  function drawToolbar() {
    clear(toolbar);
    const name = inputEl(work.name, v => { work.name = v.slice(0, 80); markDirty(); }, { label: 'Nombre del origen', max: 80 });
    name.style.width = '220px';
    const search = inputEl(query, v => { query = v; pageNo = 0; drawGrid(); }, { type: 'search', placeholder: 'Buscar en los datos…', label: 'Buscar' });
    search.style.width = '220px';
    const btn = (ic, label, fn, cls = '') => { const b = h('button', { class: 'btn ' + cls, type: 'button' }, icon(ic, 15), label); b.addEventListener('click', fn); return b; };
    toolbar.append(name,
      btn('plus', 'Fila', () => { work.rows.push(work.columns.map(() => null)); pageNo = Math.floor((work.rows.length - 1) / PER); markDirty(); drawGrid(); }),
      btn('plus', 'Columna', () => {
        let n = 'Nueva columna', k = 1;
        while (work.columns.some(c => c.name === n)) n = `Nueva columna ${++k}`;
        work.columns.push({ name: n, type: 'text', role: null, orig: null });
        work.rows.forEach(r => r.push(null));
        markDirty(); drawGrid();
      }),
      btn('swap', 'Transponer', transpose),
      btn('download', 'CSV', () => downloadFile(`${work.name}.csv`, 'text/csv;charset=utf-8', toCsv(work.columns.map(c => c.name), work.rows))),
      btn('trash', 'Eliminar origen', deleteDs, 'danger'),
      h('span', { class: 'grow' }), search);
  }
  function visibleRows() {
    const q = query.trim().toLowerCase();
    const idx = [];
    for (let i = 0; i < work.rows.length; i++) {
      if (!q || work.rows[i].some(v => v != null && String(v).toLowerCase().includes(q))) idx.push(i);
    }
    return idx;
  }
  function drawGrid() {
    clear(gridWrap);
    const idx = visibleRows();
    const pages = Math.max(1, Math.ceil(idx.length / PER));
    pageNo = clamp(pageNo, 0, pages - 1);
    const table = h('table', { class: 'dv' });

    work.columns.forEach((c, j) => {

      }, { label: 'Nombre de columna', max: 80, change: true });
      const tp = selectEl([['text', 'Texto'], ['number', 'Número'], ['date', 'Fecha']], c.type, v => {

      del.addEventListener('click', () => {

        work.columns.splice(j, 1);
        work.rows.forEach(r => r.splice(j, 1));

      hr.appendChild(h('th', null, h('div', { class: 'colhead' }, nm, h('div', { class: 'form-inline' }, tp, del))));
    });
    table.appendChild(h('thead', null, hr));
    const tb = h('tbody');
    for (const i of idx.slice(pageNo * PER, pageNo * PER + PER)) {
      const r = work.rows[i];
      const del = h('button', { class: 'dv-del', type: 'button', title: 'Eliminar fila', 'aria-label': 'Eliminar fila ' + (i + 1) }, icon('close', 12));
      del.addEventListener('click', () => { work.rows.splice(i, 1); markDirty(); drawGrid(); });
      const tr = h('tr', null, h('td', { class: 'rownum' }, h('span', { text: String(i + 1) }), del));
      work.columns.forEach((c, j) => {
        const inp = h('input', { class: 'cell' + (c.type === 'number' ? ' num' : ''), 'aria-label': `${c.name}, fila ${i + 1}` });
        inp.value = cellDisplay(r[j], c.type);
        inp.addEventListener('change', () => {
          const raw = inp.value.trim();
          const v = raw === '' ? null : convertValue(raw, c.type);
          inp.classList.toggle('invalid', raw !== '' && v == null);
          r[j] = v;
          markDirty();
        });
        tr.appendChild(h('td', null, inp));
      });
      tb.appendChild(tr);
    }
    table.appendChild(tb);
    gridWrap.appendChild(table);
    clear(pager);
    const prev = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Página anterior', disabled: pageNo === 0 }, icon('chevL', 15));
    const next = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Página siguiente', disabled: pageNo >= pages - 1 }, icon('chevR', 15));
    prev.addEventListener('click', () => { pageNo--; drawGrid(); });
    next.addEventListener('click', () => { pageNo++; drawGrid(); });
    pager.append(prev, h('span', { text: `Página ${pageNo + 1} de ${pages} · ${fmtNum(idx.length)} filas${query ? ' (filtradas)' : ''}` }), next,
      h('span', { class: 'hint', text: ' · Los cambios en los datos no se pueden deshacer con Ctrl+Z.' }));
  }
  function drawAll() { drawTabs(); drawToolbar(); drawGrid(); apply.disabled = !dirty; }

  function applyWork() {
    const names = new Set();
    for (const c of work.columns) {
      if (!c.name || names.has(c.name)) return toast('Los nombres de columna deben ser únicos y no estar vacíos', 'error');
      names.add(c.name);
    }
    const ds = dsById(work.id);
    if (!ds) return;
    const rename = new Map();
    const typeChanged = new Set();
    for (const c of work.columns) {
      if (c.orig && c.orig !== c.name) rename.set(c.orig, c.name);
      const old = c.orig ? ds.columns.find(o => o.name === c.orig) : null;
      if (old && old.type !== c.type) typeChanged.add(c.name);
    }
    const map = n => (n != null && rename.has(n) ? rename.get(n) : n);
    const snap = snapshot();
    ds.name = work.name || ds.name;
    ds.columns = work.columns.map(c => ({ name: c.name, type: c.type, role: c.role }));
    ds.rows = work.rows;
    markColumnRoles(ds.columns, ds.rows);
    delete ds._grainCache; delete ds._colorCache;
    for (const pg of App.p.pages) for (const w of pg.widgets) {
      if (w.ds !== ds.id) continue;
      w.cat = map(w.cat); w.split = map(w.split); w.vals = w.vals.map(map);
    }
    App.p.filters = App.p.filters.map(f => (f.ds === ds.id ? Object.assign({}, f, { field: map(f.field) }) : f)).filter(f => !(f.ds === ds.id && typeChanged.has(f.field)));
    pushHistory(snap);
    afterChange({});
    load(ds);
    drawAll();
    toast('Datos actualizados', 'ok');
  }
  function transpose() {
    const ds = dsById(work.id);
    if (!ds) return;
    if (dirty) return toast('Aplica o descarta los cambios antes de transponer', 'error');
    if (ds.rows.length > LIMITS.cols - 1) toast(`Solo se transponen las primeras ${LIMITS.cols - 1} filas`, 'info');
    const tr = transposeDataset(ds);
    App.p.datasets.push(tr);
    scheduleSave();
    renderLeft(); renderRight(); renderRibbon(); renderStatus();
    cur = tr; load(tr); drawAll();
    toast(`Nuevo origen creado: «${tr.name}». Úsalo con «Generar automático» o en cualquier visual.`, 'ok', 6000);
  }
  async function deleteDs() {
    const ds = dsById(work.id);
    if (!ds) return;
    const used = App.p.pages.reduce((a, pg) => a + pg.widgets.filter(w => w.ds === ds.id).length, 0);
    if (!await confirmDialog('Eliminar origen de datos', `¿Eliminar «${ds.name}»?` + (used ? ` ${used} visual(es) se quedarán sin datos.` : '') + ' Esta acción no se puede deshacer.', 'Eliminar', true)) return;
    App.p.datasets = App.p.datasets.filter(d => d !== ds);
    App.p.filters = App.p.filters.filter(f => f.ds !== ds.id);
    afterChange({});
    if (!App.p.datasets.length) return m.close();
    cur = App.p.datasets[0]; load(cur); drawAll();
  }
  drawAll();
  return m;
}

/* ---- 08-boot.js ---- */
/* ==========================================================================
   Arranque y eventos globales.
   ========================================================================== */

function renderAll() {
  renderTopbar(); renderRibbon(); renderLeft(); renderRight(); renderPages(); renderFilterBar(); renderCanvas(); renderStatus(); renderSaveState();
}
const isTyping = t => t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));

function bindEvents() {
  const title = $('#docTitle');
  title.addEventListener('input', () => mutateTyping(() => { App.p.title = title.value.slice(0, 120); }, { keepProps: true }));
  title.addEventListener('keydown', e => { if (e.key === 'Enter') title.blur(); });
  $('#themeBtn').addEventListener('click', () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
  $('#helpBtn').addEventListener('click', () => openTutorial());

  $('#fileInput').addEventListener('change', e => { const f = e.target.files[0]; if (f) handleImport(f); });
  $('#projectInput').addEventListener('change', e => openProjectFile(e.target.files[0]));
  $('#imageInput').addEventListener('change', async e => {
    const f = e.target.files[0];
    const cb = imageCallback;
    imageCallback = null;
    if (!f || !cb) return;
    try { cb.cb(await sanitizeImageFile(f, cb.maxDim)); renderLogo(); if (App.view === 'presenter') renderPresHeader(); }
    catch (err) { reportError(err); }
  });

  // Arrastrar y soltar: archivos, visuales y campos sobre el lienzo
  const area = $('#canvasArea');
  let overlay = null, dragDepth = 0;
  const hasFiles = e => Array.from(e.dataTransfer.types || []).includes('Files');
  area.addEventListener('dragenter', e => {
    if (App.view !== 'editor' || !hasFiles(e)) return;
    dragDepth++;
    if (!overlay) { overlay = h('div', { class: 'drop-overlay', text: 'Suelta aquí tu Excel o CSV' }); area.appendChild(overlay); }
  });
  area.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth && overlay) { overlay.remove(); overlay = null; } });
  area.addEventListener('dragover', e => {
    if (App.view !== 'editor') return;
    const t = Array.from(e.dataTransfer.types || []);
    if (t.includes('Files') || t.includes('application/x-4dash-viz') || t.includes('application/x-4dash-field')) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }
  });
  area.addEventListener('drop', e => {
    if (App.view !== 'editor') return;
    e.preventDefault();
    dragDepth = 0;
    if (overlay) { overlay.remove(); overlay = null; }
    const r = $('#page').getBoundingClientRect();
    const at = { x: (e.clientX - r.left) / App.scale, y: (e.clientY - r.top) / App.scale };
    const inside = at.x >= 0 && at.y >= 0 && at.x <= page().w && at.y <= page().h;
    if (hasFiles(e)) { const f = e.dataTransfer.files[0]; if (f) handleImport(f); return; }
    const viz = e.dataTransfer.getData('application/x-4dash-viz');
    if (viz && VIZ[viz]) return insertWidget(viz, inside ? at : null);
    const field = e.dataTransfer.getData('application/x-4dash-field');
    if (field) { try { const f = safeJsonParse(field); createFromField(f.ds, String(f.col), inside ? at : null); } catch { /* ignorar */ } }
  });
  // Evitar que soltar un archivo fuera del lienzo lo abra en el navegador
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', e => { if (hasFiles(e)) e.preventDefault(); });

  // Clic en zona vacía: deseleccionar
  $('#scroller').addEventListener('pointerdown', e => {
    if (App.view === 'editor' && (e.target.id === 'page' || e.target.id === 'scroller' || e.target.id === 'pageFrame') && App.sel) select(null);
  });

  let zoomRaf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(zoomRaf); zoomRaf = requestAnimationFrame(applyZoom); }).observe($('#scroller'));
  document.addEventListener('fullscreenchange', () => { document.body.classList.toggle('is-fullscreen', !!document.fullscreenElement); requestAnimationFrame(applyZoom); });
  window.addEventListener('scroll', () => Tip.hide(), true);

  document.addEventListener('keydown', onKey);
  window.addEventListener('beforeunload', e => { if (!App.prefs.autosave && App.hist.length) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('error', e => { console.error(e.error || e.message); });
  window.addEventListener('unhandledrejection', e => { reportError(e.reason); });
}

function onKey(e) {
  const ctrl = e.ctrlKey || e.metaKey;
  const k = e.key;
  if (k === 'Escape') {
    if (openMenuEl) { closeMenu(); return; }
    if (modalStack.length) { modalStack[modalStack.length - 1].close(); return; }
    if (App.view === 'presenter' && !document.fullscreenElement) { setView('editor'); return; }
    if (App.sel) { select(null); return; }
    return;
  }
  if (modalStack.length) return;
  if (k === 'F1') { e.preventDefault(); openTutorial(); return; }
  if (k === 'F5') { e.preventDefault(); setView(App.view === 'editor' ? 'presenter' : 'editor'); return; }
  if (ctrl && k.toLowerCase() === 's') { e.preventDefault(); saveProjectFile(); return; }
  if (ctrl && k.toLowerCase() === 'o') { e.preventDefault(); $('#projectInput').value = ''; $('#projectInput').click(); return; }
  if (ctrl && k.toLowerCase() === 'p') { e.preventDefault(); printDashboard(); return; }
  if (isTyping(e.target)) return;
  if (App.view === 'presenter') {
    const idx = App.p.pages.findIndex(p => p.id === App.p.active);
    if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); gotoPage(idx + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); gotoPage(idx - 1); }
    else if (k.toLowerCase() === 'f') toggleFullscreen();
    return;
  }
  if (ctrl && k.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if (ctrl && (k.toLowerCase() === 'y' || (k.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
  const w = selW();
  if (!w) return;
  if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); deleteSelected(); }
  else if (ctrl && k.toLowerCase() === 'd') { e.preventDefault(); duplicateSelected(); }
  else if (ctrl && k.toLowerCase() === 'c') { App.clipboard = JSON.stringify(w, jsonReplacer); toast('Visual copiado'); }
  else if (k.startsWith('Arrow')) {
    e.preventDefault();
    const st = e.shiftKey ? 10 : 1;
    nudge(k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0, k === 'ArrowUp' ? -st : k === 'ArrowDown' ? st : 0);
  }
}
document.addEventListener('keydown', e => {
  const ctrl = e.ctrlKey || e.metaKey;
  if (!ctrl || e.key.toLowerCase() !== 'v' || isTyping(e.target) || App.view !== 'editor' || !App.clipboard || modalStack.length) return;
  e.preventDefault();
  const w = sanitizeWidget(safeJsonParse(App.clipboard));
  if (!w) return;
  const pg = page();
  w.id = uid();
  w.x = clamp(w.x + 24, 0, Math.max(0, pg.w - w.w));
  w.y = clamp(w.y + 24, 0, Math.max(0, pg.h - w.h));
  if (w.ds && !dsById(w.ds)) w.ds = null;
  mutate(() => { pg.widgets.push(w); App.sel = w.id; });
});

function boot() {
  loadPrefs();
  const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = App.prefs.theme || (dark ? 'dark' : 'light');
  App.p = (App.prefs.autosave && loadStored()) || newProject();
  bindEvents();
  renderAll();
  if (window.top !== window.self) {
    toast('Aviso: 4Dash se está mostrando dentro de otra página. Ábrelo directamente para mayor seguridad.', 'error', 9000);
  }
  if (!App.prefs.tutorialSeen) {
    App.prefs.tutorialSeen = true;
    savePrefs();
    setTimeout(() => openTutorial(), 300);
  }
}
boot();

})();</script>
