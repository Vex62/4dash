.shape-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.shape-svg.sh-soft { filter: drop-shadow(0 1px 3px rgba(16,24,40,.18)); }
.shape-svg.sh-medium { filter: drop-shadow(0 4px 8px rgba(16,24,40,.22)); }
.shape-svg.sh-strong { filter: drop-shadow(0 12px 18px rgba(16,24,40,.32)); }
.shape-svg.sh-glow { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--primary) 60%, transparent)); }
.shape-svg.sh-float { filter: drop-shadow(0 16px 10px rgba(16,24,40,.28)); }
.shape-fill-theme { fill: var(--widget-bg); }
.shape-stroke-theme { stroke: var(--border-strong); }
.shape-text {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 8px 12px; color: var(--ink-1); line-height: 1.3; overflow: hidden; word-wrap: break-word; pointer-events: none;
}
.shape-text.left { justify-content: flex-start; text-align: left; }
.shape-text.right { justify-content: flex-end; text-align: right; }
body.mode-editor .widget { cursor: move; }
body.mode-editor .widget:hover { outline: 1px solid var(--border-strong); }
.widget.selected { outline: 2px solid var(--primary) !important; z-index: 5000 !important; }
.widget.dragging { opacity: .92; box-shadow: var(--shadow-3); }
.w-head {
  display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 6px 0 12px; flex: none; min-width: 0;
}
.w-title {
  flex: 1; font-size: var(--wt-size, 14px); font-weight: var(--wt-weight, 600); color: var(--wt-color, var(--ink-1));
  text-align: var(--wt-align, left); font-style: var(--wt-style, normal);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.w-actions {
  display: flex; gap: 0; opacity: 0; transition: opacity .1s;
  background: var(--widget-bg); border-radius: 3px;
}
.widget:hover .w-actions, .widget.selected .w-actions, .w-actions:focus-within { opacity: 1; }
.w-actions .icon-btn { width: 24px; height: 24px; cursor: pointer; }
.tut-about { margin-right: auto; }
.widget.notitle .w-head { position: absolute; right: 0; top: 0; height: 28px; z-index: 2; }
.widget.notitle .w-title { display: none; }
.w-body { flex: 1; min-height: 0; position: relative; padding: 0 10px 8px; display: flex; flex-direction: column; }
.widget.notitle .w-body { padding-top: 8px; }
.w-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  color: var(--ink-muted); font-size: 12px; text-align: center; padding: 8px;
}
.handle {
  position: absolute; width: 10px; height: 10px; background: var(--widget-bg); border: 1.5px solid var(--primary);
  border-radius: 2px; z-index: 3; display: none;
}
.widget.selected .handle { display: block; }
.handle.n, .handle.s { left: calc(50% - 5px); cursor: ns-resize; }
.handle.e, .handle.w { top: calc(50% - 5px); cursor: ew-resize; }
.handle.n { top: -6px; } .handle.s { bottom: -6px; } .handle.e { right: -6px; } .handle.w { left: -6px; }
.handle.nw { left: -6px; top: -6px; cursor: nwse-resize; } .handle.se { right: -6px; bottom: -6px; cursor: nwse-resize; }
.handle.ne { right: -6px; top: -6px; cursor: nesw-resize; } .handle.sw { left: -6px; bottom: -6px; cursor: nesw-resize; }
.size-badge {
  position: absolute; bottom: -24px; right: 0; background: var(--text); color: var(--pane-bg); font-size: 11px;
  padding: 2px 6px; border-radius: 2px; pointer-events: none; z-index: 4; white-space: nowrap;
}

/* Gráficos SVG */
svg.chart { display: block; overflow: visible; flex: 1; min-height: 0; }
svg.chart text { font-family: var(--font); }
.ax-label { fill: var(--ink-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.val-label { fill: var(--ink-2); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.val-label.strong { fill: var(--ink-1); }
.grid-line { stroke: var(--gridline); stroke-width: 1; shape-rendering: crispEdges; }
.base-line { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.crosshair { stroke: var(--ink-muted); stroke-width: 1; pointer-events: none; }
.mark { transition: opacity .12s, filter .12s; }
.mark.dim { opacity: .28; }
.hit { fill: transparent; cursor: pointer; }
.hit:hover + .mark, .mark:hover { filter: brightness(1.08); }
body.mode-editor .hit { cursor: inherit; }
.line { fill: none; stroke-width: var(--line-w, 2); stroke-linejoin: round; stroke-linecap: round; }
.area { opacity: var(--area-a, .12); }
.dot { stroke: var(--widget-bg); stroke-width: 2; }
.slice { stroke: var(--widget-bg); stroke-width: 2; stroke-linejoin: round; }
.tm-cell { stroke: var(--widget-bg); stroke-width: 2; }
.tm-label { fill: #ffffff; font-size: 11.5px; font-weight: 600; pointer-events: none; }
.tm-value { fill: #ffffff; font-size: 11px; pointer-events: none; opacity: .9; }
.center-big { fill: var(--ink-1); font-weight: 600; font-variant-numeric: normal; }
.center-small { fill: var(--ink-muted); font-size: 11px; }
.gauge-track { fill: var(--gridline); }
.gauge-target { stroke: var(--ink-1); stroke-width: 2.5; }
.f-s1 { fill: var(--series-1); } .f-s2 { fill: var(--series-2); } .f-s3 { fill: var(--series-3); } .f-s4 { fill: var(--series-4); }
.f-s5 { fill: var(--series-5); } .f-s6 { fill: var(--series-6); } .f-s7 { fill: var(--series-7); } .f-s8 { fill: var(--series-8); }
.f-so { fill: var(--series-other); }
.st-s1 { stroke: var(--series-1); } .st-s2 { stroke: var(--series-2); } .st-s3 { stroke: var(--series-3); } .st-s4 { stroke: var(--series-4); }
.st-s5 { stroke: var(--series-5); } .st-s6 { stroke: var(--series-6); } .st-s7 { stroke: var(--series-7); } .st-s8 { stroke: var(--series-8); }
.st-so { stroke: var(--series-other); }
.bg-s1 { background: var(--series-1); } .bg-s2 { background: var(--series-2); } .bg-s3 { background: var(--series-3); } .bg-s4 { background: var(--series-4); }
.bg-s5 { background: var(--series-5); } .bg-s6 { background: var(--series-6); } .bg-s7 { background: var(--series-7); } .bg-s8 { background: var(--series-8); }
.bg-so { background: var(--series-other); }

.legend {
  display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--ink-2); padding: 4px 2px 0;
  flex: none; max-height: 44px; overflow: hidden;
}
.legend.side { flex-direction: column; flex-wrap: nowrap; max-height: none; overflow: auto; justify-content: center; gap: 6px; padding: 0 0 0 8px; min-width: 0; }
.lg-item { display: inline-flex; align-items: center; gap: 6px; min-width: 0; cursor: default; }
.lg-item.clickable { cursor: pointer; }
.lg-item.dim { opacity: .4; }
.lg-key { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.lg-key.line { height: 2px; width: 14px; border-radius: 1px; }
.lg-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg-val { color: var(--ink-1); font-weight: 600; font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 8px; }
.chart-row { flex: 1; min-height: 0; display: flex; }

/* KPI */
.kpi { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; gap: 2px; }
.kpi-value { font-size: 34px; font-weight: 600; color: var(--ink-1); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-label { font-size: 12px; color: var(--ink-2); }
.kpi-delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.kpi-delta.up { color: var(--good-text); }
.kpi-delta.down { color: var(--critical); }
.kpi-delta span.sub { color: var(--ink-muted); font-weight: 400; }
.kpi-spark { height: 36px; flex: none; margin-top: 4px; }
.kpi.center { align-items: center; text-align: center; }

/* Tabla */
.tbl-wrap { flex: 1; overflow: auto; min-height: 0; scrollbar-width: thin; border-top: 1px solid var(--gridline); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.tbl th {
  position: sticky; top: 0; background: var(--widget-bg); text-align: left; font-weight: 600; color: var(--ink-2);
  padding: 6px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; cursor: pointer; user-select: none; z-index: 1;
}
.tbl th.num, .tbl td.num { text-align: right; }
.tbl th:hover { color: var(--ink-1); }
.tbl td { padding: 5px 8px; border-bottom: 1px solid var(--gridline); color: var(--ink-1); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; position: relative; }
.tbl tr:hover td { background: var(--hover); }
.tbl tr.sel td { background: var(--primary-soft); }
.tbl tfoot td { font-weight: 700; border-top: 1px solid var(--axis); border-bottom: 0; position: sticky; bottom: 0; background: var(--widget-bg); }
.tbl .bar-cell { position: absolute; left: 4px; top: 5px; bottom: 5px; border-radius: 0 3px 3px 0; opacity: .22; pointer-events: none; }
.tbl .cell-txt { position: relative; }
.tbl-note { font-size: 11px; color: var(--ink-muted); padding: 4px 2px 0; flex: none; }

/* Segmentador */
.slicer { display: flex; flex-direction: column; flex: 1; min-height: 0; gap: 6px; }
.slicer-list { flex: 1; overflow: auto; min-height: 0; scrollbar-width: thin; }
.slicer-item { display: flex; align-items: center; gap: 8px; padding: 3px 2px; font-size: 12.5px; cursor: pointer; border-radius: 2px; }
.slicer-item:hover { background: var(--hover); }
.slicer-item input { accent-color: var(--primary); margin: 0; width: 15px; height: 15px; pointer-events: none; }
.slicer-item .sname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slicer-item .scount { color: var(--ink-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.slicer-tiles { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; overflow: auto; flex: 1; }
.slicer-tile { border: 1px solid var(--border-strong); background: var(--widget-bg); border-radius: 3px; padding: 5px 12px; font-size: 12.5px; }
.slicer-tile[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
.slicer-search { border: 1px solid var(--border); border-radius: 2px; padding: 4px 8px; font-size: 12px; background: var(--widget-bg); width: 100%; }
.slicer-foot { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-muted); }
.linklike { border: 0; background: transparent; color: var(--primary); font-weight: 600; font-size: 11.5px; padding: 0; }

/* Texto e imagen */
.textbox { flex: 1; overflow: auto; color: var(--ink-1); line-height: 1.45; word-wrap: break-word; scrollbar-width: thin; }
.textbox p { margin: 0 0 6px; }
.textbox .tb-h { font-weight: 600; font-size: 1.45em; margin: 0 0 6px; line-height: 1.2; }
.textbox ul { margin: 0 0 6px; padding-left: 1.2em; }
.textbox.center { text-align: center; } .textbox.right { text-align: right; }
.textbox.vcenter { display: flex; flex-direction: column; justify-content: center; }
.imgbox { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.imgbox img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

/* ---------- Barra de páginas y estado ---------- */
.bottombar {
  display: flex; align-items: center; height: 34px; background: var(--pane-bg); border-top: 1px solid var(--border);
  padding: 0 8px; gap: 4px; min-width: 0;
}
.page-tabs { display: flex; align-items: stretch; height: 100%; gap: 0; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: none; }
.ptab {
  display: flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0 14px;
  font-size: 12.5px; color: var(--text-2); white-space: nowrap; border-top: 3px solid transparent; position: relative;
}
.ptab:hover { background: var(--hover); color: var(--text); }
.ptab[aria-selected="true"] { color: var(--text); font-weight: 600; border-top-color: var(--tab-accent); background: var(--app-bg); }
.ptab-input { width: 140px; border: 1px solid var(--primary); padding: 2px 6px; font-size: 12.5px; background: var(--pane-bg); }
.zoom-status { display: inline-flex; align-items: center; gap: 2px; }
.zoom-status .icon-btn { width: 24px; height: 24px; }
.zoom-status .linklike { min-width: 44px; font-size: 12px; }
.status { display: flex; align-items: center; gap: 14px; color: var(--text-2); font-size: 12px; white-space: nowrap; padding-left: 8px; }

/* Presentador */
body.mode-presenter .toolbar,
body.mode-presenter .pane,
body.mode-presenter .handle,
body.mode-presenter .editor-only { display: none !important; }
body.mode-editor .presenter-only { display: none !important; }
body.mode-presenter .widget { cursor: default; }
body.mode-presenter .page { box-shadow: var(--shadow-2); }
.pres-nav { display: flex; align-items: center; gap: 4px; }
.pres-header {
  display: flex; align-items: center; gap: 14px; padding: 10px 20px 0; background: var(--canvas-bg);
}
.pres-header img { max-height: 44px; max-width: 220px; object-fit: contain; }
.pres-header h1 { font-size: 20px; font-weight: 600; margin: 0; color: var(--text); }
.pres-header .ph-sub { font-size: 12px; color: var(--text-2); }
.pres-logo-bg { background: #fff; border-radius: 4px; padding: 4px 8px; display: flex; }
body:fullscreen .topbar, body.is-fullscreen .topbar { display: none; }
body.is-fullscreen #app { grid-template-rows: 0 0 1fr auto; }

/* ---------- Tooltip, toasts, menús, modales ---------- */
.tooltip {
  position: fixed; z-index: 100000; pointer-events: none; background: var(--pane-bg); color: var(--text);
  border-radius: 4px; box-shadow: var(--shadow-2); padding: 8px 10px; font-size: 12px; min-width: 120px; max-width: 320px;
  border: 1px solid var(--border);
}
.tt-title { color: var(--text-2); margin-bottom: 4px; font-size: 11.5px; }
.tt-row { display: flex; align-items: center; gap: 8px; line-height: 1.6; }
.tt-key { width: 12px; height: 2px; border-radius: 1px; flex: none; }
.tt-val { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
.tt-name { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toasts { position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%); z-index: 100001; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--text); color: var(--pane-bg); padding: 10px 16px; border-radius: 4px; box-shadow: var(--shadow-2);
  font-size: 13px; max-width: 560px; display: flex; gap: 10px; align-items: center;
}
.toast.error { background: var(--danger); color: #fff; }
.toast.ok .ico { color: var(--good); }
.menu {
  position: fixed; z-index: 100002; background: var(--pane-bg); border: 1px solid var(--border); border-radius: 4px;
  box-shadow: var(--shadow-2); padding: 4px 0; min-width: 190px;
}
.menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 7px 14px;
  font-size: 12.5px; text-align: left;
}
.menu button:hover { background: var(--hover); }
.menu button .ico { color: var(--text-2); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.menu .danger { color: var(--danger); }

.modal-backdrop {
  position: fixed; inset: 0; background: var(--overlay); z-index: 90000; display: flex; align-items: center; justify-content: center; padding: 24px;
}
.modal {
  background: var(--pane-bg); border-radius: 4px; box-shadow: var(--shadow-3); width: 100%; max-width: 640px;
  max-height: calc(100vh - 48px); display: flex; flex-direction: column; overflow: hidden;
}
.modal.wide { max-width: 1180px; height: calc(100vh - 48px); }
.modal.focus { max-width: none; width: calc(100vw - 48px); height: calc(100vh - 48px); }
.modal-head { display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px 24px; }
.modal-head h2 { flex: 1; margin: 0; font-size: 18px; font-weight: 600; }
.modal-body { padding: 8px 24px 16px; overflow: auto; flex: 1; min-height: 0; line-height: 1.5; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 24px 20px; align-items: center; }
.modal-foot .grow { flex: 1; }

/* Paletas */
.palette-modal { max-width: 760px; }
.pal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 8px; }
.pal-card {
  display: flex; flex-direction: column; gap: 0; padding: 0; border: 1px solid var(--border); border-radius: 6px;
  background: var(--pane-bg); overflow: hidden; text-align: left;
}
.pal-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-1); }
.pal-card[aria-checked="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.pal-top { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; font-size: 12px; font-weight: 700; }
.pal-top.custom { background: var(--app-bg); color: var(--text-2); }
.pal-dot { width: 10px; height: 10px; border-radius: 2px; }
.pal-strip { display: flex; height: 18px; margin: 10px 10px 0; gap: 2px; }
.pal-strip span { flex: 1; border-radius: 2px; }
.pal-name { display: flex; align-items: center; gap: 4px; padding: 8px 10px 10px; font-size: 12.5px; font-weight: 600; }
.pal-name .ico { color: var(--primary); }
.color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.color-grid.series { grid-template-columns: repeat(4, 1fr); }
.color-field { display: flex; align-items: center; gap: 8px; cursor: pointer; min-width: 0; }
.color-inp { width: 38px; height: 34px; border: 1px solid var(--border-strong); border-radius: 4px; padding: 2px; background: var(--pane-bg); cursor: pointer; flex: none; }
.cf-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cf-label { font-size: 11.5px; color: var(--text-2); font-weight: 600; }
.hex-inp { min-height: 26px; padding: 2px 6px; font-size: 12px; font-family: Consolas, "Cascadia Mono", monospace; width: 92px; }
.pal-from { margin-top: 10px; max-width: 260px; }
.a11y-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.a11y { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 6px 8px; border-radius: 3px; background: var(--app-bg); }
.a11y .ico { margin-top: 2px; flex: none; }
.a11y.ok .ico { color: var(--good-text); }
.a11y.warn { background: rgba(250, 178, 25, .14); }
.a11y.warn .ico { color: #a86b00; }
.a11y.bad { background: var(--danger-soft); }
.a11y.bad .ico { color: var(--danger); }
@media (max-width: 700px) { .color-grid, .color-grid.series { grid-template-columns: repeat(2, 1fr); } }

/* Tutorial */
.tut-step { display: grid; grid-template-columns: 64px 1fr; gap: 18px; align-items: start; min-height: 190px; }
.tut-icon { width: 64px; height: 64px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; }
.tut-step h3 { margin: 4px 0 8px; font-size: 16px; }
.tut-step p { margin: 0 0 8px; color: var(--text-2); }
.tut-step ul { margin: 0; padding-left: 18px; color: var(--text-2); }
.tut-step li { margin-bottom: 4px; }
.tut-dots { display: flex; gap: 6px; }
.tut-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); border: 0; padding: 0; }
.tut-dot[aria-current="true"] { background: var(--primary); width: 20px; border-radius: 4px; }
kbd {
  display: inline-block; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 3px;
  padding: 0 5px; font-size: 11px; font-family: inherit; background: var(--app-bg); min-width: 20px; text-align: center;
}
.kbd-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.kbd-table td { padding: 4px 6px; border-bottom: 1px solid var(--border); }
.kbd-table td:first-child { white-space: nowrap; width: 1%; }

/* Editor de datos */
.dv-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 0 24px 8px; }
.dv-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 24px; overflow-x: auto; flex: none; }
.dv-grid-wrap { flex: 1; overflow: auto; margin: 0 24px; border: 1px solid var(--border); min-height: 0; }
table.dv { border-collapse: separate; border-spacing: 0; font-size: 12px; font-variant-numeric: tabular-nums; }
.dv th, .dv td { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 0; background: var(--pane-bg); }
.dv thead th { position: sticky; top: 0; z-index: 2; background: var(--pane-head); vertical-align: top; }
.dv .rownum { position: sticky; left: 0; z-index: 1; background: var(--pane-head); color: var(--text-3); text-align: right; padding: 0 4px 0 8px; min-width: 64px; white-space: nowrap; }
.dv thead .rownum { z-index: 3; }
.dv input.cell { border: 0; background: transparent; padding: 5px 8px; width: 140px; font-size: 12px; font-variant-numeric: tabular-nums; }
.dv input.cell.num { text-align: right; }
.dv input.cell:focus { outline: 2px solid var(--primary); outline-offset: -2px; background: var(--pane-bg); }
.dv input.cell.invalid { background: var(--danger-soft); }
.dv .colhead { display: flex; flex-direction: column; gap: 3px; padding: 5px; width: 168px; }
.dv .colhead .form-inline { gap: 2px; }
.dv .colhead .form-inline > .sel { flex: 1; }
.dv .colhead .form-inline > .dv-del { flex: none; }
.dv .colhead input, .dv .colhead select { font-size: 12px; border: 1px solid var(--border); padding: 3px 5px; background: var(--pane-bg); border-radius: 2px; }

.dv-del { border: 0; background: transparent; color: var(--text-3); padding: 0 4px; }

.pager { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.dv input.cell.calc { background: var(--primary-soft); color: var(--text); cursor: default; width: 100%; min-width: 140px; }
.dv .colhead .btn.dv-calc { min-height: 0; padding: 2px 6px; font-size: 12px; gap: 4px; flex: 1; justify-content: center; color: var(--primary); }

.calc-modal { max-width: 920px; }
.calc-head > .form-row:first-child { flex: 2; }
.calc-rule { border: 1px solid var(--border); border-left: 3px solid var(--primary); border-radius: 4px; padding: 8px 10px 10px; margin: 0 0 10px; background: var(--pane-head); }
.calc-rule-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.calc-rule-head .sel { width: auto; }
.calc-rule-head .grow { flex: 1; }
.calc-badge { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--primary); background: var(--primary-soft); border-radius: 3px; padding: 2px 6px; white-space: nowrap; }
.calc-badge.then { color: var(--good-text); background: rgba(12, 163, 12, .12); }
.calc-conds { display: flex; flex-direction: column; gap: 6px; }
.calc-cond { display: flex; align-items: center; gap: 6px; }
.calc-join { flex: none; width: 18px; font-size: 11px; font-weight: 700; color: var(--text-3); text-align: center; }
.calc-cond-fields { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.calc-cond-fields > .sel, .calc-cond-fields > .inp, .calc-then > .sel, .calc-then > .inp { width: auto; flex: 1 1 120px; min-width: 0; }
.calc-cond-fields > .sel:nth-child(2) { flex-basis: 170px; }
.calc-cond-fields > .lbl { flex: none; }
.calc-cond-fields > .sel.calc-src, .calc-then > .sel.calc-src { flex: 0 1 112px; }
.calc-then > .sel.calc-src { flex-basis: 160px; }
.btn.subtle { border-color: transparent; background: transparent; color: var(--primary); margin: 6px 0 0 24px; padding: 3px 8px; min-height: 26px; }
.btn.subtle:hover { background: var(--primary-soft); }
.calc-then { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
.calc-other { border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; margin: 10px 0; }
.calc-counts { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--text-2); }
.calc-sample-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 3px; }
.calc-sample { border-collapse: collapse; font-size: 12px; width: 100%; font-variant-numeric: tabular-nums; }
.calc-sample th, .calc-sample td { padding: 4px 8px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
.calc-sample th { background: var(--pane-head); font-weight: 600; }
.calc-sample .res { background: var(--primary-soft); font-weight: 600; }
.sel.invalid, .inp.invalid { border-color: var(--danger); background: var(--danger-soft); }

  #printRoot { display: block; }

  .print-page:last-child { page-break-after: auto; break-after: auto; }
  .print-page .page { box-shadow: none; }
  .print-head { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .print-head img { max-height: 32px; }
  .widget { box-shadow: none; border: 1px solid #e1dfdd; }
  .w-actions, .handle { display: none !important; }

.color-row .icon-btn { width: 26px; height: 26px; }
.range-row { display: flex; align-items: center; gap: 8px; }
.range-row input[type=range] { flex: 1; accent-color: var(--primary); min-width: 0; }
.range-row output { font-size: 11.5px; color: var(--text-2); min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.qs-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.qs {
  height: 42px; border: 1px solid var(--border); border-radius: 6px; background: var(--app-bg); padding: 6px; display: flex;
}
.qs:hover { border-color: var(--primary); }
.qs span { flex: 1; display: block; }
.shape-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.shape-grid .viz-btn { aspect-ratio: auto; height: 34px; }
.swatch.custom { background: conic-gradient(#e34948, #eda100, #1baf7a, #2a78d6, #6250d6, #e34948); }
.series-colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.series-colors .sc { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--text-3); }
.series-colors .color-inp { width: 100%; height: 26px; }
.seg-row { display: flex; gap: 2px; }
.seg-row .btn { flex: 1; min-height: 28px; padding: 3px 6px; }
.seg-row .btn[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); }
.export-opts .form-row { margin-bottom: 12px; }
.export-preview { max-width: 100%; max-height: 220px; border: 1px solid var(--border); border-radius: 4px; display: block; margin: 4px auto 0; background: var(--canvas-bg); }

/* ---------- Adaptación a zoom del navegador y pantallas estrechas ---------- */
@media (max-width: 1280px) {
  .pane:not(.collapsed) { width: 236px; }
  .pane.right:not(.collapsed) { width: 268px; }
  .doc-title { width: 200px; }
}
@media (max-width: 1100px) {
  .save-state { display: none; }
  .logo-slot { min-width: 40px; }
  .logo-slot:not(.has-logo) span { display: none; }
}
@media (max-width: 980px) {
  /* Los paneles pasan a flotar sobre el lienzo para no estrecharlo */
  .workspace { position: relative; }
  .pane:not(.collapsed) { position: absolute; top: 0; bottom: 0; z-index: 70; box-shadow: var(--shadow-3); }
  .pane.left:not(.collapsed) { left: 0; }
  .pane.right:not(.collapsed) { right: 0; }
  .segmented button .seg-lbl { display: none; }
  .doc-title { width: auto; flex: 1 1 80px; min-width: 60px; }
  .topbar { gap: 6px; }
}
@media (max-width: 640px) {
  .brand .brand-name { display: none; }
  .brand { padding: 0 10px; }
  .topbar { gap: 4px; padding-right: 6px; }
  .top-btn { width: 30px; }
  .segmented button { padding: 5px 8px; }
  .pres-nav .save-state { display: none; }
  .pane:not(.collapsed) { width: min(300px, calc(100vw - 40px)); }
  .status > span:not(:last-child):not(.zoom-status) { display: none; }
  .ptab { padding: 0 10px; }
}
@media (max-width: 440px) {
  /* Muy estrecho (zoom ≥ 350 %): todo sigue visible; el título se acorta */
  .brand { padding: 0 6px; border-right: 0; }
  .topbar { gap: 2px; padding-right: 4px; }
  .top-btn { width: 26px; height: 30px; }
  .help-btn { width: 24px; height: 24px; font-size: 12px; }
  .segmented button { padding: 4px 6px; }
  .logo-slot { min-width: 30px; padding: 2px 4px; }
  .logo-slot.has-logo img { max-width: 60px; }
  .doc-title { min-width: 36px; font-size: 13px; padding: 4px; }
  .toolbar { padding: 2px 4px; }
  .tgroup { padding: 0 1px; }
  .tbtn { padding: 0 5px; }
  .pres-nav .top-btn { width: 24px; }
}
@media (max-height: 560px) {
  #app { grid-template-rows: 40px auto 1fr auto; }
  .toolbar { min-height: 38px; padding: 2px 6px; }
  .tbtn { height: 30px; }
  .tbtn:not(.keep) .tb-lbl { display: none; }
  .bottombar { height: 30px; }
  .top-btn { width: 30px; height: 30px; }
  .logo-slot { height: 30px; }
  .pane-head { height: 30px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }

/**
 * Convierte una matriz de celdas en una tabla tipada.

    n = n.replace(/\s+/g, ' ').trim().slice(0, 80) || `Columna ${j + 1}`;

/** Lee un archivo (File) y devuelve tablas [{name, columns, rows, info}]. */
async function importFile(file) {
  if (!file) throw new UserError('No se seleccionó ningún archivo.');
  if (file.size > LIMITS.fileBytes) throw new UserError(`El archivo supera el tamaño máximo (${Math.round(LIMITS.fileBytes / 1048576)} MB).`);
  const name = String(file.name || 'datos');
  const ext = (name.match(/\.([a-z0-9]+)$/i) || [, ''])[1].toLowerCase();
  const buf = await file.arrayBuffer();
  const head = new Uint8Array(buf, 0, Math.min(8, buf.byteLength));
  const isZip = head[0] === 0x50 && head[1] === 0x4b;
  const isOle = head[0] === 0xd0 && head[1] === 0xcf && head[2] === 0x11 && head[3] === 0xe0;
  const tables = [];
  if (isOle) throw new UserError('Formato .xls antiguo (o archivo cifrado) no soportado. Ábrelo en Excel y guárdalo como .xlsx o CSV.');
  if (isZip) {
    if (!['xlsx', 'xlsm', 'xltx', 'xltm', ''].includes(ext)) throw new UserError('Tipo de archivo no soportado. Usa .xlsx, .xlsm o .csv.');
    const sheets = await parseXlsx(buf);
    for (const sh of sheets) {
      const t = buildTable(sh.grid);
      if (t) tables.push({ name: sh.name, ...t, hidden: sh.hidden, truncated: sh.truncated || t.info.truncated });
    }
  } else {
    if (!['csv', 'tsv', 'txt'].includes(ext)) throw new UserError('Tipo de archivo no soportado. Usa .xlsx, .xlsm o .csv.');
    const text = decodeText(buf);
    if (/[\u0000-\u0008\u000e-\u001f]/.test(text.slice(0, 4096))) throw new UserError('El archivo no parece texto CSV válido.');
    const { grid, decimalComma } = parseCsv(text);
    const t = buildTable(grid, { decimalComma });
    if (t) tables.push({ name: name.replace(/\.[^.]+$/, '').slice(0, 80), ...t, truncated: t.info.truncated });
  }
  if (!tables.length) throw new UserError('No se encontraron datos en el archivo.');
  return tables;
}

  const si = (w.split && VIZ[w.type] && VIZ[w.type].split) ? colIdx(ds, w.split) : -1;
  const splitType = si >= 0 ? ds.columns[si].type : null;
  const splitGrain = si >= 0 ? effectiveGrain(ds, w, w.split) : null;

  const groups = new Map(); // catKey -> Map(seriesKey -> acc)
  const seriesTotals = new Map();
  const mIdx = measures.map(m => (m == null ? -1 : colIdx(ds, m)));
  const mAgg = measures.map(m => (m == null ? 'count' : measureAgg(ds, w, m)));
  for (const r of rows) {
    const ck = ci >= 0 ? keyOf(r[ci], catType, grain) : '(Total)';
    let g = groups.get(ck);
    if (!g) { g = new Map(); groups.set(ck, g); }
    if (si >= 0) {
      const sk = keyOf(r[si], splitType, splitGrain);
      let a = g.get(sk);
      if (!a) { a = makeAcc(); g.set(sk, a); }
      const v = mIdx[0] < 0 ? 1 : r[mIdx[0]];
      accAdd(a, v, mAgg[0]);
      const t = typeof v === 'number' ? Math.abs(v) : 1;
      seriesTotals.set(sk, (seriesTotals.get(sk) || 0) + t);
    } else {
      for (let m = 0; m < measures.length; m++) {
        let a = g.get(m);
        if (!a) { a = makeAcc(); g.set(m, a); }
        accAdd(a, mIdx[m] < 0 ? 1 : r[mIdx[m]], mAgg[m]);
      }
    }
  }

  // Series
  let seriesDefs;
  if (si >= 0) {
    const allKeys = Array.from(seriesTotals.entries()).sort((a, b) => b[1] - a[1]).map(e => e[0]);
    const keep = allKeys.slice(0, allKeys.length > 8 ? 7 : 8);
    const slots = assignSlots(keep.concat(allKeys.length > 8 ? [OTHER] : []), colorOrder(ds, w.split, splitGrain));
    seriesDefs = keep.map(k => ({ key: k, name: labelOf(k, splitType, splitGrain), slot: slots.get(k) }));
    if (allKeys.length > 8) seriesDefs.push({ key: OTHER, name: OTHER, slot: 'o', rest: new Set(allKeys.slice(7)) });
    if (splitType === 'date') seriesDefs.sort((a, b) => (a.key < b.key ? -1 : 1));
  } else {
    seriesDefs = measures.map((m, idx) => ({ key: idx, name: measures.length > 1 ? m : measureName(ds, w, m), slot: measures.length === 1 ? (w.slot || 0) : idx }));
  }

  let cats = Array.from(groups.keys()).map(key => ({ key, label: ci >= 0 ? labelOf(key, catType, grain) : 'Total' }));
  const valueOf = (ck, sd) => {
    const g = groups.get(ck);
    if (!g) return null;
    if (sd.rest) {
      let acc = null;
      for (const k of sd.rest) { const a = g.get(k); if (a) { const v = accValue(a, mAgg[0]); if (v != null) acc = (acc || 0) + v; } }
      return acc;
    }
    const a = g.get(sd.key);
    return a ? accValue(a, si >= 0 ? mAgg[0] : mAgg[sd.key]) : null;
  };
  const catTotal = new Map(cats.map(c => [c.key, seriesDefs.reduce((s, sd) => s + (valueOf(c.key, sd) || 0), 0)]));

  // Orden
  let sort = w.sort || 'auto';
  if (sort === 'auto') {
    // Las categorías que parecen periodos (meses, trimestres…) conservan el orden original
    const periodic = catType === 'text' && cats.length > 1 && cats.slice(0, 12).every(c => c.key === BLANK || looksLikePeriod(c.key));
    if (catType === 'date' || catType === 'number') sort = 'cat-asc';
    else if (periodic || ['line', 'area'].includes(w.type)) sort = 'none';
    else sort = 'value-desc';
  }
  const cmpKey = (a, b) => {
    if (catType === 'number') return Number(a.key) - Number(b.key);
    return a.key === BLANK ? 1 : b.key === BLANK ? -1 : a.key.localeCompare(b.key, LOCALE, { numeric: true });
  };
  if (sort === 'value-desc') cats.sort((a, b) => catTotal.get(b.key) - catTotal.get(a.key));
  else if (sort === 'value-asc') cats.sort((a, b) => catTotal.get(a.key) - catTotal.get(b.key));
  else if (sort === 'cat-desc') cats.sort((a, b) => -cmpKey(a, b));
  else if (sort === 'cat-asc') cats.sort(cmpKey);

  // Top N
  const top = +w.top || 0;
  let otherCat = null;
  if (top > 0 && cats.length > top) {
    const rest = cats.slice(top);
    cats = cats.slice(0, top);
    if (['pie', 'donut', 'treemap'].includes(w.type)) otherCat = rest;
  }
  if (['pie', 'donut', 'treemap'].includes(w.type) && !otherCat && cats.length > 8) {
    const sorted = cats.slice().sort((a, b) => catTotal.get(b.key) - catTotal.get(a.key));
    const keepSet = new Set(sorted.slice(0, 7).map(c => c.key));
    otherCat = cats.filter(c => !keepSet.has(c.key));
    cats = cats.filter(c => keepSet.has(c.key));
  }
  const series = seriesDefs.map(sd => ({ name: sd.name, key: sd.key, slot: sd.slot, values: cats.map(c => valueOf(c.key, sd)) }));
  if (otherCat) {
    cats.push({ key: OTHER, label: OTHER, rest: otherCat.map(c => c.key) });
    for (const sr of series) {
      const sd = seriesDefs.find(d => d.key === sr.key);
      sr.values.push(otherCat.reduce((s, c) => s + (valueOf(c.key, sd) || 0), 0));
    }
  }
  // Colores por categoría (circular / árbol)
  let catSlots = null;
  if (['pie', 'donut', 'treemap'].includes(w.type)) catSlots = assignSlots(cats.map(c => c.key), colorOrder(ds, w.cat, grain));

  const own = filters.find(f => f.ds === ds.id && f.field === w.cat && f.values.length);
  return { cats, series, catType, grain, catSlots, highlight: own ? new Set(own.values) : null, rowCount: rows.length };
}

/* ---------- Diseño automático ---------- */
function distinctCount(ds, i, cap = 1000) {
  const s = new Set();
  for (const r of ds.rows) { if (r[i] != null) s.add(r[i]); if (s.size > cap) break; }
  return s.size;
}
function pickAgg(name) {
  return /(precio|price|tasa|rate|ratio|%|porcentaje|media|promedio|avg|average|margen %|nota|score|puntuaci|satisfacci|valoraci|evaluaci|calificaci|antigüedad|(1-5)|(1-10)|rating|nps|índice|indice|temperatura|edad|age)/i.test(name) ? 'avg' : 'sum';
}

/** Genera widgets para un dataset siguiendo heurísticas tipo "Quick Insights". */
function autoDashboard(ds, opts = {}) {
  const cols = ds.columns.map((c, i) => ({ ...c, i, distinct: distinctCount(ds, i) }));
  const nums = cols.filter(c => c.type === 'number' && c.role !== 'id' && c.role !== 'year');
  const dates = cols.filter(c => c.type === 'date');
  const years = cols.filter(c => c.role === 'year');
  const cats = cols.filter(c => c.type === 'text' && c.distinct >= 2 && c.distinct <= Math.max(60, ds.rows.length * 0.5) && c.distinct < ds.rows.length)
    .sort((a, b) => scoreCat(a) - scoreCat(b));
  function scoreCat(c) { return Math.abs(c.distinct - 6) + (c.distinct > 30 ? 40 : 0); }
  const widgets = [];
  const M = 16, G = 16, W = PAGE_W - M * 2;
  let y = M;

  if (ds.info && ds.info.title && opts.titleBox !== false) {
    widgets.push(newWidget('text', ds, { x: M, y, w: W, h: 56, text: '# ' + ds.info.title, bg: false, vcenter: true, fontSize: 14 }));
    y += 56 + 8;
  }

  const sumAbs = c => { let t = 0; for (const r of ds.rows) if (typeof r[c.i] === 'number') t += Math.abs(r[c.i]); return t; };
  const maxAbs = c => { let t = 0; for (const r of ds.rows) if (typeof r[c.i] === 'number') t = Math.max(t, Math.abs(r[c.i])); return t; };
  const fmtFor = c => {
    if (!c) return {};
    if (/%|porcentaje|tasa|ratio/i.test(c.name)) return maxAbs(c) <= 1.5 ? { fmt: 'percent' } : { fmt: 'percentRaw' };
    if (/\$|usd/i.test(c.name)) return { fmt: 'currency', currency: 'USD' };
    if (/€|\beur|importe|ventas|coste|costo|precio|ingreso|facturaci|gasto|beneficio|presupuesto/i.test(c.name)) return { fmt: 'currency', currency: 'EUR', dec: 0 };
    return {};
  };
  const measure = c => (c ? Object.assign({ vals: [c.name], agg: pickAgg(c.name) }, fmtFor(c)) : { vals: [], agg: 'count' });
  // Medida principal: la de mayor magnitud entre las que se suman
  const summable = nums.filter(c => pickAgg(c.name) === 'sum');
  const main = (summable.length ? summable : nums).slice().sort((a, b) => sumAbs(b) - sumAbs(a))[0] || null;
  const half = Math.floor((W - G) / 2);

  // Tabla cruzada (títulos en filas)
  if (ds.info && ds.info.rowTitles && cols[0]) {
    const label = cols[0].name;
    const tr = opts.transposed;
    if (tr) {
      const tc = tr.columns[0].name;
      const series = tr.columns.slice(1).filter(c => c.type === 'number').slice(0, 8).map(c => c.name);
      const last = nums[nums.length - 1];
      widgets.push(newWidget('line', tr, { x: M, y, w: W, h: 320, cat: tc, vals: series, title: `Evolución por ${tc.toLowerCase()}` }));
      y += 320 + G;
      widgets.push(newWidget('stacked', tr, { x: M, y, w: half, h: 320, cat: tc, vals: series, title: `Total por ${tc.toLowerCase()}` }));
      if (last) widgets.push(newWidget('donut', ds, { x: M + half + G, y, w: W - half - G, h: 320, cat: label, ...measure(last), agg: 'sum' }));
      y += 320 + G;
    } else {
      const kpis = nums.slice(0, 4);
      const kw = Math.floor((W - G * (kpis.length - 1)) / Math.max(1, kpis.length));
      kpis.forEach((c, k) => widgets.push(newWidget('kpi', ds, { x: M + k * (kw + G), y, w: kw, h: 112, slot: k, ...measure(c) })));
      if (kpis.length) y += 112 + G;
      const second = nums.find(c => c !== main) || main;
      widgets.push(newWidget('column', ds, { x: M, y, w: half, h: 320, cat: label, ...measure(main) }));
      widgets.push(newWidget('donut', ds, { x: M + half + G, y, w: W - half - G, h: 320, cat: label, ...measure(second) }));
      y += 320 + G;
    }
    const th = Math.min(360, 96 + ds.rows.length * 28);
    widgets.push(newWidget('table', ds, { x: M, y, w: W, h: th, vals: ds.columns.map(c => c.name).slice(0, 14), dataBars: false }));
    y += th + G;
    return { widgets, height: y };
  }

  // KPIs
  const kpis = nums.slice(0, 4).map((c, k) => ({ slot: k, ...measure(c) }));
  if (kpis.length < 4) kpis.push({ vals: [], agg: 'count', title: 'Registros', slot: kpis.length });
  const kw = Math.floor((W - G * (kpis.length - 1)) / kpis.length);
  const trendCat = dates[0] ? dates[0].name : null;
  kpis.forEach((k, idx) => widgets.push(newWidget('kpi', ds, { x: M + idx * (kw + G), y, w: kw, h: 120, cat: trendCat && k.vals.length ? trendCat : null, ...k })));
  y += 120 + G;

  // Cada visual usa una categoría distinta y una sola escala (sin ejes dobles)
  const used = new Set();
  const take = pred => { const c = cats.find(x => !used.has(x.name) && pred(x)); if (c) used.add(c.name); return c; };
  const rowItems = [];
  const tc = dates[0] || years[0];
  if (tc) rowItems.push(newWidget('area', ds, { cat: tc.name, ...measure(main) }));
  const c1 = take(() => true);
  if (c1) rowItems.push(newWidget('column', ds, { cat: c1.name, ...measure(main), top: c1.distinct > 15 ? 12 : 0 }));
  const c2 = take(c => c.distinct <= 8);
  if (c2) rowItems.push(newWidget('donut', ds, { cat: c2.name, ...measure(main) }));
  const c3 = rowItems.length < 4 ? take(() => true) : null;
  if (c3) rowItems.push(newWidget('bar', ds, { cat: c3.name, ...measure(main), top: 10 }));
  if (nums.length >= 2 && rowItems.length < 4) {
    const other = nums.find(c => c !== main);
    rowItems.push(newWidget('scatter', ds, { vals: [main.name, other.name], cat: c1 ? c1.name : null, agg: 'sum' }));
  }

  // Selector de filtro a la izquierda, preferiblemente con un campo no usado
  const slicerCat = cats.find(c => c.distinct <= 25 && !used.has(c.name)) || cats.find(c => c.distinct <= 25);
  let x0 = M, avail = W;
  const rowsNeeded = Math.ceil(rowItems.length / 2);
  if (slicerCat && rowItems.length) {
    const sh = rowsNeeded * 320 + (rowsNeeded - 1) * G;
    widgets.push(newWidget('slicer', ds, { x: M, y, w: 224, h: sh, cat: slicerCat.name }));
    x0 = M + 224 + G; avail = W - 224 - G;
  }
  for (let k = 0; k < rowItems.length; k++) {
    const col = k % 2, row = Math.floor(k / 2);
    const alone = k === rowItems.length - 1 && col === 0;
    const hw = Math.floor((avail - G) / 2);
    Object.assign(rowItems[k], { x: x0 + col * (hw + G), y: y + row * (320 + G), w: alone ? avail : hw, h: 320 });
    widgets.push(rowItems[k]);
  }
  if (rowItems.length) y += rowsNeeded * (320 + G);

  widgets.push(newWidget('table', ds, { x: M, y, w: W, h: 320, vals: ds.columns.map(c => c.name).slice(0, 14) }));
  y += 320 + G;
  return { widgets, height: y };
}

/** Transpone una tabla con títulos de fila (crea filas a partir de columnas). */
function transposeDataset(ds, headerName) {
  const labels = ds.rows.map(r => (r[0] == null ? BLANK : String(r[0])));
  const seen = new Map();
  const newNames = labels.map(l => { const c = (seen.get(l) || 0) + 1; seen.set(l, c); return c > 1 ? `${l} (${c})` : l; }).slice(0, LIMITS.cols - 1);
  headerName = headerName || (ds.info && ds.info.periodHeaders ? 'Periodo' : 'Atributo');
  const grid = [[headerName, ...newNames]];
  for (let j = 1; j < ds.columns.length; j++) {
    grid.push([ds.columns[j].name, ...ds.rows.slice(0, newNames.length).map(r => r[j])]);
  }
  const t = buildTable(grid);
  return { id: uid(), name: (ds.name + ' (transpuesta)').slice(0, 80), columns: t.columns, rows: t.rows, info: t.info, v: 1 };
}

/* ---------- Datos de ejemplo ---------- */
function sampleGrid() {
  let seed = 42;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const regions = ['Norte', 'Sur', 'Este', 'Oeste', 'Centro'];
  const cats = { Hardware: ['Portátil Pro', 'Monitor 27"', 'Dock USB-C'], Software: ['Licencia ERP', 'Suite Ofimática', 'Antivirus'], Servicios: ['Soporte 24/7', 'Consultoría', 'Implantación'], Formación: ['Curso de análisis de datos', 'Taller de hojas de cálculo'] };
  const canales = ['Online', 'Tienda', 'Partner'];
  const grid = [['Informe de ventas 2025'], [], ['Fecha', 'Región', 'Categoría', 'Producto', 'Canal', 'Unidades', 'Ventas (€)', 'Coste (€)', 'Satisfacción']];
  const regionW = [1.3, 0.8, 1, 0.9, 1.5];
  for (let i = 0; i < 480; i++) {
    const month = Math.floor(rnd() * 12);
    const day = 1 + Math.floor(rnd() * 28);
    const ri = Math.floor(rnd() * regions.length);
    const cat = Object.keys(cats)[Math.floor(rnd() * 4)];
    const prods = cats[cat];
    const prod = prods[Math.floor(rnd() * prods.length)];
    const canal = canales[Math.floor(rnd() * (rnd() < 0.2 ? 3 : 2.4))] || 'Online';
    const units = 1 + Math.floor(rnd() * (cat === 'Software' ? 40 : 15));
    const price = { Hardware: 420, Software: 95, Servicios: 680, Formación: 250 }[cat] * (0.8 + rnd() * 0.4);
    const season = 1 + 0.25 * Math.sin((month - 2) / 12 * Math.PI * 2) + month * 0.03;
    const sales = Math.round(units * price * season * regionW[ri]);
    const cost = Math.round(sales * (0.45 + rnd() * 0.25));
    grid.push([new Date(Date.UTC(2025, month, day)), regions[ri], cat, prod, canal, units, sales, cost, Math.round((3.2 + rnd() * 1.8) * 10) / 10]);
  }
  return grid;
}

/* ---- 04-charts.js ---- */
/* ==========================================================================
   Motor de visualizaciones (SVG / HTML). Sin dependencias.
   Reglas: colores categóricos en orden fijo, marcas finas, extremos
   redondeados de 4px, separación de 2px, rejilla discreta, leyenda con >= 2
   series, tooltip en todos los gráficos, textos siempre vía textContent.
   ========================================================================== */

const slotCls = (prefix, slot) => `${prefix}-${slot === 'o' || slot == null ? 'so' : 's' + ((+slot % 8) + 1)}`;

/* ---------- Tooltip global ---------- */
const Tip = {
  el: null,
  show(evt, title, rows) {
    const el = this.el || (this.el = $('#tooltip'));
    clear(el);
    // Colores personalizados del visual de origen
    const src = evt && evt.target && evt.target.closest ? evt.target.closest('.widget') : null;
    for (let i = 1; i <= 8; i++) {
      const c = src ? src.style.getPropertyValue('--series-' + i) : '';
      if (c) el.style.setProperty('--series-' + i, c); else el.style.removeProperty('--series-' + i);
    }
    if (title) el.appendChild(h('div', { class: 'tt-title', text: title }));
    for (const r of rows) {
      el.appendChild(h('div', { class: 'tt-row' },
        r.slot !== undefined ? h('span', { class: 'tt-key ' + slotCls('bg', r.slot) }) : null,
        h('span', { class: 'tt-val', text: r.value }),
        r.name ? h('span', { class: 'tt-name', text: r.name }) : null));
    }
    el.classList.remove('hidden');
    this.move(evt);
  },
  move(evt) {
    const el = this.el;
    if (!el || el.classList.contains('hidden')) return;
    const pad = 14, r = el.getBoundingClientRect();
    let x = evt.clientX + pad, y = evt.clientY + pad;
    if (x + r.width > innerWidth - 4) x = evt.clientX - r.width - pad;
    if (y + r.height > innerHeight - 4) y = evt.clientY - r.height - pad;
    el.style.left = Math.max(4, x) + 'px';
    el.style.top = Math.max(4, y) + 'px';
  },
  hide() { if (this.el) this.el.classList.add('hidden'); }
};

/* ---------- Escalas y utilidades ---------- */
function niceTicks(lo, hi, count) {
  if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 1; }
  if (lo === hi) { if (lo === 0) hi = 1; else if (lo > 0) lo = 0; else hi = 0; }
  const span = hi - lo;
  const step0 = span / Math.max(1, count);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const err = step0 / mag;
  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step;
  const ticks = [];
  for (let v = a, n = 0; v <= b + step * 1e-6 && n < 50; v += step, n++) ticks.push(+v.toPrecision(12));
  if (ticks.length < 2) ticks.push(a + step);
  return ticks;
}
function niceCeil(v) {
  if (!(v > 0)) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * mag >= v) return m * mag;
  return 10 * mag;
}
/** Barra con extremo de datos redondeado (4px por defecto) y base recta. */
function barPath(x, y, w, h, dir, rad = 4) {
  if (w <= 0 || h <= 0) return '';
  const r = dir === 'right' || dir === 'left' ? Math.min(rad, h / 2, w) : Math.min(rad, w / 2, h);
  if (r <= 0) return `M${x},${y}h${w}v${h}h${-w}Z`;
  switch (dir) {
    case 'up': return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
    case 'down': return `M${x},${y}V${y + h - r}Q${x},${y + h} ${x + r},${y + h}H${x + w - r}Q${x + w},${y + h} ${x + w},${y + h - r}V${y}Z`;
    case 'right': return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
    default: return `M${x + w},${y}H${x + r}Q${x},${y} ${x},${y + r}V${y + h - r}Q${x},${y + h} ${x + r},${y + h}H${x + w}Z`;
  }
}
/** Curva suave (Catmull-Rom → Bézier cúbica) que pasa por todos los puntos. */
function smoothPath(pts) {
  if (pts.length < 3) return pts.map((p, j) => (j ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const t = 0.18;
    const c1 = [p1[0] + (p2[0] - p0[0]) * t, p1[1] + (p2[1] - p0[1]) * t];
    const c2 = [p2[0] - (p3[0] - p1[0]) * t, p2[1] - (p3[1] - p1[1]) * t];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
/** Ancho de barra: automático (fino) o según el «ancho del intervalo» elegido. */
function barWidth(w, band, gN) {
  if (w.barGap == null) return Math.max(2, Math.min(24, (band * 0.72 - (gN - 1) * 2) / gN));
  return Math.max(2, (band * (1 - w.barGap / 100) - (gN - 1) * 2) / gN);
}
function arcPath(cx, cy, r0, r1, a0, a1) {
  const large = a1 - a0 > Math.PI ? 1 : 0;

  const svg = s('svg', { class: 'chart', width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': ctx.title });
  body.appendChild(svg);
  for (const r of squarify(items, 0, 0, W, H)) {
    const slot = data.catSlots.get(r.c.key);
    const dim = data.highlight && !data.highlight.has(r.c.key);
    const rect = s('rect', { x: r.x + 1, y: r.y + 1, width: Math.max(0, r.w - 2), height: Math.max(0, r.h - 2), rx: 3, class: 'tm-cell mark ' + slotCls('f', slot) + (dim ? ' dim' : '') }, svg);
    rect.addEventListener('pointermove', e => Tip.show(e, r.c.label, [{ value: fmtV(sr.values[r.i]), name: nf({ style: 'percent', maximumFractionDigits: 1 }).format(r.v / total), slot }]));
    rect.addEventListener('pointerleave', () => Tip.hide());
    rect.addEventListener('click', e => { if (ctx.interactive() && w.cat) ctx.onPick(w.cat, r.c.rest ? r.c.rest : [r.c.key], data.grain, additive(e)); });
    if (r.w > 44 && r.h > 22) {
      const lab = truncateText(r.c.label, r.w - 14, 11.5, 600);
      if (lab) s('text', { x: r.x + 8, y: r.y + 18, class: 'tm-label' }, svg).textContent = lab;
      if (w.labels && r.h > 38) {
        const vl = truncateText(fmtV(sr.values[r.i]), r.w - 14, 11);
        if (vl) s('text', { x: r.x + 8, y: r.y + 33, class: 'tm-value' }, svg).textContent = vl;
      }
    }
  }
}

/* ---------- Dispersión ---------- */
function renderScatter(w, body, ctx) {
  const ds = ctx.ds;
  const xi = colIdx(ds, w.vals[0]), yi = colIdx(ds, w.vals[1]);
  if (xi < 0 || yi < 0 || ds.columns[xi].type !== 'number' || ds.columns[yi].type !== 'number') {
    return emptyMsg(body, 'scatter', 'Elige dos campos numéricos', 'Eje X y eje Y en el panel Datos');
  }
  const fmtV = v => fmtNum(v, w.fmt, w.dec, w.currency);
  let pts = [];
  const rows = filteredRows(ds, ctx.filters);
  const ci = colIdx(ds, w.cat);
  let seriesItems = null;
  if (ci >= 0) {
    // Un punto por categoría (valores agregados)
    const t = ds.columns[ci].type, g = effectiveGrain(ds, w);
    const groups = new Map();
    for (const r of rows) {
      const k = keyOf(r[ci], t, g);
      let a = groups.get(k);
      if (!a) { a = [makeAcc(), makeAcc()]; groups.set(k, a); }
      accAdd(a[0], r[xi], w.agg === 'count' ? 'sum' : w.agg); accAdd(a[1], r[yi], w.agg === 'count' ? 'sum' : w.agg);
    }
    const agg = w.agg === 'count' ? 'sum' : w.agg;
    for (const [k, a] of groups) {
      const x = accValue(a[0], agg), y = accValue(a[1], agg);
      if (x != null && y != null) pts.push({ x, y, label: labelOf(k, t, g), key: k, slot: w.slot || 0 });
    }
  } else {
    const si = w.split ? colIdx(ds, w.split) : -1;
    let slots = null;
    if (si >= 0) {
      const t = ds.columns[si].type;
      const counts = new Map();
      for (const r of rows) { const k = keyOf(r[si], t); counts.set(k, (counts.get(k) || 0) + 1); }
      const keys = Array.from(counts.entries()).sort((a, b) => b[1] - a[1]).map(e => e[0]);
      // dispersión: máx. 3 colores + "Otros" (todas las parejas deben distinguirse)
      const keep = keys.slice(0, keys.length > 4 ? 3 : 4);
      slots = assignSlots(keep, colorOrder(ds, w.split));
      if (keep.length > 3) slots.set(keep[3], slots.get(keep[3]));
      seriesItems = keep.map(k => ({ name: labelOf(k, t), slot: slots.get(k), key: k }));
      if (keys.length > keep.length) seriesItems.push({ name: OTHER, slot: 'o', key: null });
    }
    for (const r of rows) {
      const x = r[xi], y = r[yi];
      if (typeof x !== 'number' || typeof y !== 'number') continue;
      let slot = w.slot || 0, label = null;
      if (slots) { const k = keyOf(r[si], ds.columns[si].type); slot = slots.has(k) ? slots.get(k) : 'o'; label = labelOf(k, ds.columns[si].type); }
      pts.push({ x, y, slot, label });
      if (pts.length >= 5000) break;
    }
  }
  if (!pts.length) return emptyMsg(body, 'scatter', 'Sin puntos que mostrar');
  const W = ctx.W;
  let H = ctx.H;
  if (seriesItems && w.showLegend) H -= legendHeight(seriesItems, W);
  const svg = s('svg', { class: 'chart', width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': ctx.title });
  body.appendChild(svg);
  if (seriesItems && w.showLegend) body.appendChild(legendItems(seriesItems, 'rect'));
  let xmn = Infinity, xmx = -Infinity, ymn = Infinity, ymx = -Infinity;
  for (const p of pts) { xmn = Math.min(xmn, p.x); xmx = Math.max(xmx, p.x); ymn = Math.min(ymn, p.y); ymx = Math.max(ymx, p.y); }
  const xt = niceTicks(Math.min(0, xmn), xmx, Math.max(2, Math.floor(W / 100)));
  const yt = niceTicks(Math.min(0, ymn), ymx, Math.max(2, Math.floor(H / 56)));
  const fx = v => fmtAxis(v, w.fmt, w.currency);
  const x0 = Math.ceil(Math.max(...yt.map(t => textWidth(fx(t))))) + 10, x1 = W - 12, y0 = 8, y1 = H - 34;
  const sx = v => x0 + (v - xt[0]) / (xt[xt.length - 1] - xt[0]) * (x1 - x0);
  const sy = v => y1 - (v - yt[0]) / (yt[yt.length - 1] - yt[0]) * (y1 - y0);
  for (const t of yt) {
    if (w.gridlines) s('line', { class: 'grid-line', x1: x0, x2: x1, y1: Math.round(sy(t)) + .5, y2: Math.round(sy(t)) + .5 }, svg);
    s('text', { class: 'ax-label', x: x0 - 6, y: sy(t) + 4, 'text-anchor': 'end' }, svg).textContent = fx(t);
  }
  for (const t of xt) {
    if (w.gridlines) s('line', { class: 'grid-line', y1: y0, y2: y1, x1: Math.round(sx(t)) + .5, x2: Math.round(sx(t)) + .5 }, svg);
    s('text', { class: 'ax-label', x: sx(t), y: y1 + 16, 'text-anchor': 'middle' }, svg).textContent = fx(t);
  }
  s('line', { class: 'base-line', x1: x0, x2: x1, y1: y1 + .5, y2: y1 + .5 }, svg);
  s('text', { class: 'ax-label', x: (x0 + x1) / 2, y: H - 2, 'text-anchor': 'middle' }, svg).textContent = truncateText(w.vals[0], x1 - x0);
  const g = s('g', null, svg);
  for (const p of pts) {
    p.sx = sx(p.x); p.sy = sy(p.y);
    const dim = ctx.highlight && p.key != null && !ctx.highlight.has(p.key);
    s('circle', { cx: p.sx.toFixed(1), cy: p.sy.toFixed(1), r: 4, class: 'dot mark ' + slotCls('f', p.slot) + (dim ? ' dim' : ''), 'fill-opacity': pts.length > 400 ? 0.7 : 1 }, g);
  }
  const ring = s('circle', { r: 7, class: 'hidden', fill: 'none', 'stroke-width': 2, 'pointer-events': 'none' }, svg);
  const overlay = s('rect', { class: 'hit', x: x0, y: y0, width: Math.max(0, x1 - x0), height: Math.max(0, y1 - y0) }, svg);
  const nearest = e => {
    const b = svg.getBoundingClientRect(), k = b.width / W || 1;
    const mx = (e.clientX - b.left) / k, my = (e.clientY - b.top) / k;
    let best = null, bd = 30 * 30;
    for (const p of pts) { const d = (p.sx - mx) ** 2 + (p.sy - my) ** 2; if (d < bd) { bd = d; best = p; } }
    return best;
  };
  overlay.addEventListener('pointermove', e => {
    const p = nearest(e);
    if (!p) { ring.classList.add('hidden'); Tip.hide(); return; }
    ring.setAttribute('cx', p.sx); ring.setAttribute('cy', p.sy);
    ring.setAttribute('class', slotCls('st', p.slot));
    Tip.show(e, p.label, [{ value: fmtV(p.x), name: w.vals[0] }, { value: fmtV(p.y), name: w.vals[1] }]);
  });
  overlay.addEventListener('pointerleave', () => { ring.classList.add('hidden'); Tip.hide(); });
  overlay.addEventListener('click', e => {
    const p = nearest(e);
    if (p && p.key != null && ctx.interactive() && w.cat) ctx.onPick(w.cat, [p.key], effectiveGrain(ds, w), additive(e));
  });
}

/* ---------- KPI ---------- */
function renderKpi(w, body, ctx) {
  const ds = ctx.ds;
  const rows = filteredRows(ds, ctx.filters);
  const m = w.vals[0] || null;
  const value = m ? totalOf(ds, rows, w, m) : rows.length;
  const box = h('div', { class: 'kpi' + (w.align === 'center' ? ' center' : '') });
  body.appendChild(box);
  const txt = fmtNum(value, w.fmt === 'auto' && Math.abs(value) >= 1e6 ? 'compact' : w.fmt, w.dec, w.currency);
  const fs = clamp(Math.min(ctx.H * 0.42, (ctx.W - 8) / Math.max(4, txt.length * 0.58)), 16, 46);
  const v = h('div', { class: 'kpi-value', text: txt, title: fmtNum(value, w.fmt === 'compact' ? 'auto' : w.fmt, w.dec, w.currency) });
  v.style.fontSize = fs + 'px';
  box.appendChild(v);
  const label = m ? measureName(ds, w, m) : 'Recuento de filas';
  if (!w.showTitle || (w.title && w.title !== label)) box.appendChild(h('div', { class: 'kpi-label', text: label }));
  // Comparación: objetivo o periodo anterior
  let delta = null, sub = '';
  let spark = null;
  const ci = colIdx(ds, w.cat);
  if (w.target != null && w.target !== '' && isFinite(+w.target) && +w.target !== 0) {
    delta = (value - +w.target) / Math.abs(+w.target);
    sub = 'vs objetivo ' + fmtNum(+w.target, w.fmt === 'auto' ? 'compact' : w.fmt, w.dec, w.currency);
  }
  if (ci >= 0 && m) {
    const agg = aggregate(ds, Object.assign({}, w, { type: 'line', sort: 'cat-asc', top: 0, split: null }), ctx.filters, { keepOwnField: true });
    const vals = agg.series[0].values;
    if (vals.length >= 2) {
      spark = vals;
      const a = vals[vals.length - 2], b = vals[vals.length - 1];
      if (delta == null && a) { delta = (b - a) / Math.abs(a); sub = 'último periodo (' + agg.cats[vals.length - 1].label + ') vs anterior'; }
    }
  }
  if (delta != null && isFinite(delta)) {
    const up = delta >= 0;
    box.appendChild(h('div', { class: 'kpi-delta ' + (up ? 'up' : 'down') },
      h('span', { text: up ? '▲' : '▼', 'aria-hidden': 'true' }),
      h('span', { text: (up ? '+' : '') + nf({ style: 'percent', maximumFractionDigits: 1 }).format(delta) }),
      h('span', { class: 'sub', text: sub })));
  }
  if (spark && ctx.H >= 100) {
    const SW = ctx.W, SH = 34;
    const svg = s('svg', { class: 'kpi-spark', width: SW, height: SH, viewBox: `0 0 ${SW} ${SH}`, 'aria-hidden': 'true' });
    let mn = Infinity, mx = -Infinity;
    for (const x of spark) if (x != null) { mn = Math.min(mn, x); mx = Math.max(mx, x); }
    if (mx === mn) { mx += 1; mn -= 1; }
    const px = i => 4 + i * (SW - 8) / Math.max(1, spark.length - 1);
    const py = x => SH - 5 - (x - mn) / (mx - mn) * (SH - 10);
    const pts = spark.map((x, i) => (x == null ? null : [px(i), py(x)])).filter(Boolean);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
    s('path', { d: d + `L${pts[pts.length - 1][0]},${SH}L${pts[0][0]},${SH}Z`, class: 'area ' + slotCls('f', w.slot) }, svg);
    s('path', { d, class: 'line ' + slotCls('st', w.slot) }, svg);
    const lp = pts[pts.length - 1];
    s('circle', { cx: lp[0], cy: lp[1], r: 3.5, class: 'dot ' + slotCls('f', w.slot) }, svg);
    box.appendChild(svg);
  }
}

/* ---------- Medidor ---------- */
function renderGauge(w, body, ctx) {
  const ds = ctx.ds;
  const rows = filteredRows(ds, ctx.filters);
  const m = w.vals[0] || null;
  const value = (m ? totalOf(ds, rows, w, m) : rows.length) || 0;
  const target = w.target != null && w.target !== '' && isFinite(+w.target) ? +w.target : null;
  const max = w.gaugeMax != null && w.gaugeMax !== '' && +w.gaugeMax > 0 ? +w.gaugeMax : niceCeil(Math.max(value, target || 0) * (target ? 1.15 : 1.5));
  const fmtV = v => fmtNum(v, w.fmt === 'auto' ? 'compact' : w.fmt, w.dec, w.currency);
  const W = ctx.W, H = ctx.H;
  const svg = s('svg', { class: 'chart', width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': ctx.title });
  body.appendChild(svg);
  const r1 = Math.max(20, Math.min(W / 2 - 16, H - 40)), r0 = r1 * 0.72;
  const cx = W / 2, cy = Math.min(H - 26, r1 + 10 + (H - 36 - r1) / 2);
  s('path', { d: arcPath(cx, cy, r0, r1, Math.PI, 2 * Math.PI - 0.0001), class: 'gauge-track' }, svg);
  const frac = clamp(value / max, 0, 1);
  if (frac > 0) {
    const p = s('path', { d: arcPath(cx, cy, r0, r1, Math.PI, Math.PI + Math.PI * frac - 0.0001), class: 'mark ' + slotCls('f', w.slot) }, svg);
    p.addEventListener('pointermove', e => Tip.show(e, measureName(ds, w, m), [{ value: fmtNum(value, w.fmt, w.dec, w.currency), name: 'Valor' }].concat(target != null ? [{ value: fmtNum(target, w.fmt, w.dec, w.currency), name: 'Objetivo' }] : [])));
    p.addEventListener('pointerleave', () => Tip.hide());
  }
  if (target != null && target <= max) {
    const a = Math.PI + Math.PI * clamp(target / max, 0, 1);
    s('line', { x1: cx + (r0 - 6) * Math.cos(a), y1: cy + (r0 - 6) * Math.sin(a), x2: cx + (r1 + 6) * Math.cos(a), y2: cy + (r1 + 6) * Math.sin(a), class: 'gauge-target' }, svg);
  }
  const big = clamp(r0 * 0.42, 14, 34);
  s('text', { x: cx, y: cy - 4, 'text-anchor': 'middle', class: 'center-big', 'font-size': big }, svg).textContent = truncateText(fmtV(value), r0 * 1.8, big, 600);
  if (target != null) s('text', { x: cx, y: cy + 14, 'text-anchor': 'middle', class: 'center-small' }, svg).textContent = nf({ style: 'percent', maximumFractionDigits: 0 }).format(value / target) + ' del objetivo';
  s('text', { x: cx - (r0 + r1) / 2, y: cy + 16, 'text-anchor': 'middle', class: 'ax-label' }, svg).textContent = '0';
  s('text', { x: cx + (r0 + r1) / 2, y: cy + 16, 'text-anchor': 'middle', class: 'ax-label' }, svg).textContent = fmtAxis(max, w.fmt, w.currency);
}

/* ---------- Tabla ---------- */
function renderTable(w, body, ctx) {
  const ds = ctx.ds;
  const fmtV = v => fmtNum(v, w.fmt, w.dec, w.currency);
  let head = [], rows = [], numeric = [], totals = null, keys = null;
  const sortCol = w._sortCol, sortDir = w._sortDir || 'desc';
  const ci = colIdx(ds, w.cat);
  if (ci >= 0) {
    const data = aggregate(ds, Object.assign({}, w, { type: 'table', split: null, vals: w.vals.filter(v => { const c = colOf(ds, v); return c && (c.type === 'number' || ['count', 'distinct'].includes(w.agg)); }) }), ctx.filters);
    head = [w.cat].concat(data.series.map(sr => sr.name));
    numeric = head.map((_, j) => j > 0);
    rows = data.cats.map((c, i) => [c.label].concat(data.series.map(sr => sr.values[i])));
    keys = data.cats.map(c => c);
    const fr = filteredRows(ds, ctx.filters, w.cat);
    const measures = w.vals.filter(v => { const c = colOf(ds, v); return c && (c.type === 'number' || ['count', 'distinct'].includes(w.agg)); });
    totals = ['Total'].concat(measures.length ? measures.map(m => totalOf(ds, fr, w, m)) : [fr.length]);
    ctx.highlight = data.highlight;
  } else {
    const cols = (w.vals.length ? w.vals : ds.columns.map(c => c.name)).map(n => colIdx(ds, n)).filter(i => i >= 0);
    head = cols.map(i => ds.columns[i].name);
    numeric = cols.map(i => ds.columns[i].type === 'number');
    const fr = filteredRows(ds, ctx.filters);
    rows = fr.map(r => cols.map(i => (ds.columns[i].type === 'date' && r[i] ? fmtDateKey(r[i]) : r[i])));
    rows._raw = fr.map(r => cols.map(i => r[i]));
    totals = w.totals ? cols.map((i, j) => (j === 0 ? 'Total' : ds.columns[i].type === 'number' && ds.columns[i].role !== 'id' && ds.columns[i].role !== 'year' ? fr.reduce((a, r) => a + (typeof r[i] === 'number' ? r[i] : 0), 0) : '')) : null;
  }
  if (!head.length) return emptyMsg(body, 'table', 'Añade columnas a la tabla');
  // Orden
  let order = rows.map((_, i) => i);
  if (sortCol != null && sortCol < head.length) {
    const src = rows._raw || rows;
    order.sort((a, b) => {
      const x = src[a][sortCol], y = src[b][sortCol];
      if (x == null) return 1; if (y == null) return -1;
      const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), LOCALE, { numeric: true });
      return sortDir === 'asc' ? c : -c;
    });
  }
  const MAX = 500;
  const shown = order.slice(0, MAX);
  const maxAbs = numeric.map((isNum, j) => isNum ? Math.max(0, ...shown.map(i => Math.abs(rows[i][j] || 0))) : 0);
  const wrap = h('div', { class: 'tbl-wrap' });
  const table = h('table', { class: 'tbl' });
  const thead = h('thead'), trh = h('tr');
  head.forEach((name, j) => {
    const th = h('th', { class: numeric[j] ? 'num' : '', scope: 'col', title: 'Ordenar por ' + name, text: name + (sortCol === j ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '') });
    th.addEventListener('click', e => {
      e.stopPropagation();
      if (w._sortCol === j) w._sortDir = w._sortDir === 'asc' ? 'desc' : 'asc'; else { w._sortCol = j; w._sortDir = numeric[j] ? 'desc' : 'asc'; }
      ctx.rerender();
    });
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);
  const tb = h('tbody');
  for (const i of shown) {
    const r = rows[i];
    const tr = h('tr');
    if (keys && ctx.highlight && ctx.highlight.has(keys[i].key)) tr.classList.add('sel');
    r.forEach((v, j) => {
      const td = h('td', { class: numeric[j] ? 'num' : '' });
      if (numeric[j] && typeof v === 'number') {
        if (w.dataBars && maxAbs[j] > 0 && (keys || ctx.ds.columns[colIdx(ds, head[j])]?.role == null)) {
          const bar = h('div', { class: 'bar-cell ' + slotCls('bg', w.slot) });
          bar.style.width = `calc(${(Math.abs(v) / maxAbs[j] * 100).toFixed(1)}% - 8px)`;
          td.appendChild(bar);
        }
        td.appendChild(h('span', { class: 'cell-txt', text: fmtV(v) }));
      } else td.textContent = v == null ? '' : String(v);
      if (!numeric[j] && v != null) td.title = String(v);
      tr.appendChild(td);
    });
    if (keys) {
      tr.addEventListener('click', e => {
        if (!ctx.interactive()) return;
        const c = keys[i];
        ctx.onPick(w.cat, c.rest ? c.rest : [c.key], effectiveGrain(ds, w), additive(e));
      });
      tr.style.cursor = 'pointer';
    }
    tb.appendChild(tr);
  }
  table.appendChild(tb);
  if (w.totals && totals) {
    const tf = h('tfoot'), tr = h('tr');
    totals.forEach((v, j) => tr.appendChild(h('td', { class: numeric[j] ? 'num' : '', text: typeof v === 'number' ? fmtV(v) : (v || '') })));
    tf.appendChild(tr);
    table.appendChild(tf);
  }
  wrap.appendChild(table);
  wrap.addEventListener('pointerdown', e => e.stopPropagation(), { passive: true });
  body.appendChild(wrap);
  if (rows.length > MAX) body.appendChild(h('div', { class: 'tbl-note', text: `Mostrando ${fmtNum(MAX)} de ${fmtNum(rows.length)} filas. Exporta los datos para verlas todas.` }));
}

/* ---------- Selector de filtro ---------- */
function renderSlicer(w, body, ctx) {
  const ds = ctx.ds;
  const ci = colIdx(ds, w.cat);
  if (ci < 0) return emptyMsg(body, 'slicer', 'Elige un campo para filtrar');
  const col = ds.columns[ci];
  const grain = effectiveGrain(ds, w);
  const counts = new Map();
  for (const r of filteredRows(ds, ctx.filters, w.cat)) { const k = keyOf(r[ci], col.type, grain); counts.set(k, (counts.get(k) || 0) + 1); }
  const own = ctx.filters.find(f => f.ds === ds.id && f.field === w.cat);
  const sel = new Set(own ? own.values : []);
  for (const k of sel) if (!counts.has(k)) counts.set(k, 0);
  let keys = Array.from(counts.keys());
  if (col.type === 'number') keys.sort((a, b) => Number(a) - Number(b));
  else keys.sort((a, b) => (a === BLANK ? 1 : b === BLANK ? -1 : a.localeCompare(b, LOCALE, { numeric: true })));
  const box = h('div', { class: 'slicer' });
  body.appendChild(box);
  const toggle = (k, e) => { if (ctx.interactive()) ctx.onToggle(w.cat, k, grain, !!(e && (e.ctrlKey || e.metaKey)) || w.slicerStyle !== 'single'); };
  let search = null;
  if (keys.length > 8 && w.slicerStyle !== 'tiles') {
    search = h('input', { class: 'slicer-search', type: 'search', placeholder: 'Buscar…', 'aria-label': 'Buscar valores' });
    box.appendChild(search);
    search.addEventListener('pointerdown', e => e.stopPropagation());
  }
  const list = h('div', { class: w.slicerStyle === 'tiles' ? 'slicer-tiles' : 'slicer-list', role: 'listbox', 'aria-multiselectable': 'true', 'aria-label': w.cat });
  box.appendChild(list);
  const draw = () => {
    clear(list);
    const q = search ? search.value.trim().toLowerCase() : '';
    let n = 0;
    for (const k of keys) {
      const label = labelOf(k, col.type, grain);
      if (q && !label.toLowerCase().includes(q)) continue;
      if (++n > 400) break;
      if (w.slicerStyle === 'tiles') {

  if (!ds) return emptyMsg(body, def.icon, 'Sin origen de datos', 'Importa un Excel o elige un origen en el panel Datos');
  try {
    if (w.type === 'kpi') return renderKpi(w, body, ctx);

const modalStack = [];

  const prevFocus = document.activeElement;
  const titleId = 'm' + uid();
  const closeBtn = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Cerrar', title: 'Cerrar (Esc)' }, icon('close', 18));
  const modal = h('div', { class: 'modal ' + cls, role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titleId },
    h('div', { class: 'modal-head' }, labelledIcon ? icon(labelledIcon, 20) : null, h('h2', { id: titleId, text: title }), closeBtn),
    body, foot || null);
  const back = h('div', { class: 'modal-backdrop' }, modal);

    el: modal,

      const i = modalStack.indexOf(api);

  return api;
}

    const cancel = h('button', { class: 'btn', type: 'button', text: 'Cancelar' });

async function sanitizeImageFile(file, maxDim = 1200) {
  if (!file) throw new UserError('No se seleccionó ninguna imagen.');
  if (file.size > LIMITS.imageBytes) throw new UserError('La imagen supera el tamaño máximo de 8 MB.');
  const b = new Uint8Array(await file.slice(0, 16).arrayBuffer());
  const isPng = b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47;
  const isJpg = b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff;
  const isGif = b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x38;
  const isWebp = b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 && b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50;
  if (!(isPng || isJpg || isGif || isWebp)) throw new UserError('Formato de imagen no permitido. Usa PNG, JPG, WEBP o GIF (SVG no se admite por seguridad).');
  let bmp;

  const k = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * k)), hgt = Math.max(1, Math.round(bmp.height * k));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = hgt;
  cv.getContext('2d').drawImage(bmp, 0, 0, w, hgt);
  if (bmp.close) bmp.close();

  if (url.length > 1.5 * 1024 * 1024) {

    url = webp.startsWith('data:image/webp') ? webp : cv.toDataURL('image/jpeg', 0.9);
  }
  if (!isSafeImageDataUrl(url)) throw new UserError('No se pudo procesar la imagen.');

}

function openTutorial(start = 0) {

      dots.appendChild(d);
    });
    prev.disabled = i === 0;
    next.textContent = i === TUTORIAL.length - 1 ? 'Empezar' : 'Siguiente';
  };
  prev.addEventListener('click', () => { if (i > 0) { i--; draw(); } });

/* ---------- Interacción: mover y redimensionar ---------- */
function onWidgetPointerDown(e, w, el) {
  if (App.view !== 'editor' || e.button !== 0) return;
  if (e.target.closest('.w-actions, input, textarea, select, button, .tbl-wrap, .slicer-list, .slicer-tiles')) {
    if (App.sel !== w.id) select(w.id);
    if (e.target.closest('.tbl-wrap, .slicer-list, .slicer-tiles')) App.armed = w.id;
    return;
  }

  const wasSelected = App.sel === w.id;
  if (!wasSelected) select(w.id);
  App.armed = wasSelected && !handle ? w.id : null;

  const clearGuides = () => guidesRoot.querySelectorAll('.guide').forEach(g => g.remove());
  const onMove = ev => {
    const dx = (ev.clientX - start.x) / App.scale, dy = (ev.clientY - start.y) / App.scale;

      moving = true; App.armed = null; Tip.hide();

      el.appendChild(badge);
    }
    ev.preventDefault();
    const doSnap = App.p.snap && !ev.altKey;
    const sn = v => (doSnap ? Math.round(v / GRID) * GRID : Math.round(v));
    let { gx: x, gy: y, gw: ww, gh: hh } = start;
    if (mode === 'move') { x = sn(start.gx + dx); y = sn(start.gy + dy); }
    else {
      if (mode.includes('e')) ww = sn(start.gx + start.gw + dx) - x;
      if (mode.includes('s')) hh = sn(start.gy + start.gh + dy) - y;
      if (mode.includes('w')) { const nx = sn(start.gx + dx); ww = start.gx + start.gw - nx; x = nx; }
      if (mode.includes('n')) { const ny = sn(start.gy + dy); hh = start.gy + start.gh - ny; y = ny; }
      if (ww < 80) { if (mode.includes('w')) x -= 80 - ww; ww = 80; }
      if (hh < 60) { if (mode.includes('n')) y -= 60 - hh; hh = 60; }
    }

    clearGuides();
    if (mode === 'move' && !ev.altKey) {

      let bestX = null, bestY = null;
      for (const [off] of [[0], [ww / 2], [ww]]) for (const gxv of xs) { const d = gxv - (x + off); if (Math.abs(d) <= tol && (!bestX || Math.abs(d) < Math.abs(bestX.d))) bestX = { d, at: gxv }; }
      for (const [off] of [[0], [hh / 2], [hh]]) for (const gyv of ys) { const d = gyv - (y + off); if (Math.abs(d) <= tol && (!bestY || Math.abs(d) < Math.abs(bestY.d))) bestY = { d, at: gyv }; }

      if (bestY) { y += bestY.d; const g = h('div', { class: 'guide h' }); g.style.top = bestY.at + 'px'; guidesRoot.appendChild(g); }
    }
    x = clamp(x, 0, Math.max(0, pg.w - ww));

    ww = Math.min(ww, pg.w);
    Object.assign(w, { x: Math.round(x), y: Math.round(y), w: Math.round(ww), h: Math.round(hh) });
    Object.assign(el.style, { left: w.x + 'px', top: w.y + 'px', width: w.w + 'px', height: w.h + 'px' });
    badge.textContent = mode === 'move' ? `X ${w.x} · Y ${w.y}` : `${w.w} × ${w.h}`;
    if (mode !== 'move' && !raf) {
      raf = requestAnimationFrame(() => {
        raf = 0;

    clearGuides();
    if (moving) {
      el.classList.remove('dragging');
      if (badge) badge.remove();
      if (w.y + w.h > pg.h && pg.size !== 'custom' && mode !== 'move') { /* se permite sobresalir: el usuario puede ajustar la página */ }
      pushHistory(snap0);
      afterChange({ only: 'widget', w });
    }
    setTimeout(() => { if (App.armed === w.id && !moving) { /* el clic ya se procesó */ } App.armed = null; }, 0);
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}

/* ---------- Acciones sobre widgets ---------- */
function findFreeSpot(pg, ww, hh) {
  const fits = (x, y) => x + ww <= pg.w && y + hh <= pg.h && !pg.widgets.some(o => x < o.x + o.w + 8 && x + ww + 8 > o.x && y < o.y + o.h + 8 && y + hh + 8 > o.y);

}
function insertWidget(type, at, extra) {

}
/** Elige campos razonables para un visual nuevo. */

  const date = cols.find(c => c.type === 'date');
  const text = cols.map((c, i) => ({ c, d: c.type === 'text' ? distinctCount(ds, i, 200) : 0 })).filter(x => x.d >= 2 && x.d <= 50).sort((a, b) => Math.abs(a.d - 6) - Math.abs(b.d - 6))[0];
  const t = w.type;

  else if (['line', 'area'].includes(t)) { w.cat = (date && date.name) || (text && text.c.name) || null; w.vals = num ? [num.name] : []; }
  else if (t === 'kpi' || t === 'gauge') { w.vals = num ? [num.name] : []; }
  else if (t === 'slicer') { w.cat = (text && text.c.name) || (date && date.name) || (cols[0] && cols[0].name); }
  else if (t === 'scatter') { const ns = cols.filter(c => c.type === 'number' && !c.role); w.vals = ns.slice(0, 2).map(c => c.name); }
  if (w.vals[0]) w.agg = pickAgg(w.vals[0]);
  if (t === 'stacked' && text) { const other = cols.find(c => c.type === 'text' && c.name !== w.cat && distinctCount(ds, colIdx(ds, c.name), 20) <= 8); if (other) w.split = other.name; }
}
function changeType(w, t) {

  toast(`Importado: ${use.length} hoja(s), ${fmtNum(use.reduce((a, t) => a + t.rows.length, 0))} filas · ${notes.join(' · ')}`, 'ok', 6000);
}
function buildPagesFor(tables) {
  const pages = [];

    const ds = { id: uid(), name: t.name, columns: t.columns, rows: t.rows, info: t.info, v: 1 };
