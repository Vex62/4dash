/* ---- 06b-export.js ---- */
/* ==========================================================================
   Exportación del dashboard tal y como se ve en el Presentador:
   PNG (imagen), SVG (vectorial) y PDF (una página por página del dashboard).
   Sin librerías: el DOM se serializa dentro de un SVG (foreignObject), el
   navegador lo dibuja en un canvas y el PDF se escribe a mano con las
   imágenes JPEG incrustadas (DCTDecode).
   ========================================================================== */

const EXPORT_PAD = 24;

/** Valores actuales de todas las variables CSS (tema + paleta). */
function exportVars() {
  const css = $('style').textContent;
  const names = new Set(css.match(/--[a-z0-9-]+(?=\s*:)/gi) || []);
  for (let i = 1; i <= 8; i++) names.add('--series-' + i);
  for (const n of ['--brand-top', '--seg-on-bg', '--seg-on-fg']) names.add(n);
  const cs = getComputedStyle(document.documentElement);
  const out = [];
  for (const n of names) { const v = cs.getPropertyValue(n).trim(); if (v) out.push([n, v]); }
  return out;
}

/** Construye (fuera de pantalla) la página tal y como se ve en el Presentador. */
function buildExportNode(pg, header) {
  const root = h('div', { class: 'export-root' });
  for (const [n, v] of exportVars()) root.style.setProperty(n, v);
  Object.assign(root.style, {
    position: 'fixed', left: '-100000px', top: '0', width: (pg.w + EXPORT_PAD * 2) + 'px', padding: EXPORT_PAD + 'px',
    background: 'var(--canvas-bg)', fontFamily: 'var(--font)', fontSize: '13px', color: 'var(--text)', boxSizing: 'border-box'
  });
  if (header) {
    const hd = h('div', { class: 'pres-header' }, presHeaderNodes(pg));
    Object.assign(hd.style, { padding: '0 0 16px', background: 'transparent' });
    root.appendChild(hd);
  }
  const frame = h('div');
  Object.assign(frame.style, { position: 'relative', width: pg.w + 'px', height: pg.h + 'px' });
  const pe = h('div', { class: 'page' });
  Object.assign(pe.style, { width: pg.w + 'px', height: pg.h + 'px' });
  applyPageBg(pg, pe);
  pg.widgets.forEach((w, i) => pe.appendChild(widgetEl(w, i, { editable: false, print: true })));
  frame.appendChild(pe);
  root.appendChild(frame);
  return root;
}

/** Serializa la página a un documento SVG autónomo (estilos incluidos). */
function pageToSvg(pg, header, scale) {
  const node = buildExportNode(pg, header);
  document.body.appendChild(node);
  const W = pg.w + EXPORT_PAD * 2;
  const H = Math.ceil(node.getBoundingClientRect().height);
  // El estado de casillas y campos es una propiedad: se copia a atributos para que se serialice
  node.querySelectorAll('input').forEach(i => { if (i.checked) i.setAttribute('checked', ''); if (i.value) i.setAttribute('value', i.value); });
  // Caracteres de control que XML no admite (pueden venir de los datos importados)
  const bad = /[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g;
  const tw = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
  for (let n = tw.nextNode(); n; n = tw.nextNode()) if (bad.test(n.data)) { bad.lastIndex = 0; n.data = n.data.replace(bad, ''); }
  node.querySelectorAll('[title],[aria-label],[value]').forEach(el => { for (const a of ['title', 'aria-label', 'value']) { const v = el.getAttribute(a); if (v && bad.test(v)) { bad.lastIndex = 0; el.setAttribute(a, v.replace(bad, '')); } } });
  node.remove();
  Object.assign(node.style, { position: 'static', left: '', top: '' });
  node.insertBefore(h('style', { text: $('style').textContent }), node.firstChild);
  const xml = new XMLSerializer().serializeToString(node);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(W * scale)}" height="${Math.round(H * scale)}" viewBox="0 0 ${W} ${H}">`
    + `<foreignObject x="0" y="0" width="${W}" height="${H}">${xml}</foreignObject></svg>`;
  return { svg, W, H };
}

/** Escala máxima segura para el canvas (límite de píxeles del navegador). */
function safeScale(W, H, want) {
  return Math.max(0.1, Math.min(want, 16000 / W, 16000 / H, Math.sqrt(40e6 / (W * H))));
}

async function rasterize(svg, wPx, hPx, bg) {
  // URL data: (no blob:): en file:// un SVG blob con foreignObject «contamina» el canvas
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  {
    const img = new Image();
    await new Promise((res, rej) => {
      img.addEventListener('load', res, { once: true });
      img.addEventListener('error', () => rej(new UserError('El navegador no pudo dibujar el dashboard como imagen. Prueba a exportar en SVG.')), { once: true });
      img.src = url;
    });
    await new Promise(r => setTimeout(r, 40));
    const cv = document.createElement('canvas');
    cv.width = wPx; cv.height = hPx;
    const cx = cv.getContext('2d');
    cx.fillStyle = bg;
    cx.fillRect(0, 0, wPx, hPx);
    cx.drawImage(img, 0, 0, wPx, hPx);
    return cv;
  }
}
function canvasBlob(cv, type, q) {
  return new Promise((res, rej) => {
    try { cv.toBlob(b => (b ? res(b) : rej(new UserError('No se pudo generar la imagen.'))), type, q); }
    catch { rej(new UserError('El navegador bloqueó la conversión a imagen. Exporta en SVG o usa Imprimir → Guardar como PDF.')); }
  });
}

/* ---------- PDF mínimo (PDF 1.4, una imagen JPEG por página) ---------- */
function pdfText(t) {
  let hex = 'FEFF';
  for (const ch of String(t)) {
    const c = ch.codePointAt(0);
    if (c > 0xffff) { const v = c - 0x10000; hex += (0xd800 + (v >> 10)).toString(16).padStart(4, '0') + (0xdc00 + (v & 0x3ff)).toString(16).padStart(4, '0'); }
    else hex += c.toString(16).padStart(4, '0');
  }
  return '<' + hex.toUpperCase() + '>';
}
function buildPdf(pages, title) {
  const enc = new TextEncoder();
  const chunks = [], offs = [];
  let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n`); body(); push('\nendobj\n'); };
  const d = new Date(), p2 = v => String(v).padStart(2, '0');
  const stamp = `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;
  push('%PDF-1.4\n');
  push(new Uint8Array([0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a]));
  const n = pages.length;
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Count ${n} /Kids [${pages.map((_, i) => `${4 + 3 * i} 0 R`).join(' ')}] >>`));
  obj(3, () => push(`<< /Title ${pdfText(title)} /Creator (4Dash) /Producer (4Dash) /CreationDate (D:${stamp}) >>`));
  pages.forEach((p, i) => {
    const P = 4 + 3 * i;
    obj(P, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${p.pw} ${p.ph}] /Resources << /XObject << /Im${i} ${P + 1} 0 R >> >> /Contents ${P + 2} 0 R >>`));
    obj(P + 1, () => {
      push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`);
      push(p.jpeg);
      push('\nendstream');
    });
    const c = `q ${p.pw} 0 0 ${p.ph} 0 0 cm /Im${i} Do Q`;
    obj(P + 2, () => push(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`));
  });
  const size = 4 + 3 * n;
  const xref = len;
  push(`xref\n0 ${size}\n0000000000 65535 f \n`);
  for (let k = 1; k < size; k++) push(String(offs[k]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size ${size} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(chunks, { type: 'application/pdf' });
}

/* ---------- Proceso de exportación ---------- */
async function exportDashboard(opts) {
  const pages = opts.pages === 'all' ? App.p.pages : [page()];
  const prevTheme = document.documentElement.dataset.theme;
  const theme = opts.theme === 'current' ? prevTheme : opts.theme;
  const base = safeFileName(App.p.title || 'dashboard');
  const busy = toast('Exportando…', 'info', 120000);
  const pdfPages = [];
  try {
    if (theme !== prevTheme) { document.documentElement.dataset.theme = theme; applyPalette(); }
    const docs = pages.map(pg => ({ pg, ...pageToSvg(pg, opts.header, 1) }));
    if (theme !== prevTheme) { document.documentElement.dataset.theme = prevTheme; applyPalette(); }
    const bg = theme === 'dark' ? '#0e1117' : '#ffffff';
    for (const d of docs) {
      const name = pages.length > 1 ? `${base} - ${d.pg.name}` : base;
      if (opts.fmt === 'svg') { downloadFile(name + '.svg', 'image/svg+xml', d.svg); continue; }
      const sc = safeScale(d.W, d.H, opts.scale);
      const wPx = Math.round(d.W * sc), hPx = Math.round(d.H * sc);
      const svg = d.svg.replace(/^<svg([^>]*?) width="\d+" height="\d+"/, `<svg$1 width="${wPx}" height="${hPx}"`);
      const cv = await rasterize(svg, wPx, hPx, bg);
      if (opts.fmt === 'png') { downloadFile(name + '.png', 'image/png', await canvasBlob(cv, 'image/png')); await new Promise(r => setTimeout(r, 250)); }
      else {
        const jpeg = new Uint8Array(await (await canvasBlob(cv, 'image/jpeg', 0.92)).arrayBuffer());
        pdfPages.push({ jpeg, w: wPx, h: hPx, pw: +(d.W * 0.75).toFixed(2), ph: +(d.H * 0.75).toFixed(2) });
      }
    }
    if (opts.fmt === 'pdf') downloadFile(base + '.pdf', 'application/pdf', buildPdf(pdfPages, App.p.title || 'Dashboard'));
    busy.remove();
    toast(`Exportado: ${pages.length} página(s) en ${opts.fmt.toUpperCase()}`, 'ok');
  } catch (err) {
    if (document.documentElement.dataset.theme !== prevTheme) { document.documentElement.dataset.theme = prevTheme; applyPalette(); }
    busy.remove();
    reportError(err);
  }
}

/* ---- 07-dataeditor.js ---- */
/* ==========================================================================
   Editor de datos: ver y modificar celdas, columnas, tipos y orígenes.
   Se trabaja sobre una copia; los cambios se aplican al pulsar «Aplicar».
   ========================================================================== */

function convertValue(v, type) {
  if (v == null || v === '') return null;
  if (type === 'number') {
    if (typeof v === 'number') return v;
    return parseNumberStr(String(v), true);
  }
  if (type === 'date') {
    if (typeof v === 'number') return v > 20000 && v < 80000 ? dateToIso(serialToDate(v, false)) : null;
    const t = String(v);
    return ISO_RE.test(t) ? t : parseDateStr(t);
  }
  return typeof v === 'number' ? String(v) : String(v).slice(0, 2000);
}
function cellDisplay(v, type) {
  if (v == null) return '';
  if (type === 'number') return String(v).replace('.', ',');
  return String(v);
}

function openDataEditor(dsId) {
  if (!App.p.datasets.length) return toast('Todavía no hay datos. Importa un Excel primero.');
  let cur = dsById(dsId) || App.p.datasets[0];
  let work = null, pageNo = 0, query = '', dirty = false;
  const PER = 100;
  const load = ds => {
    work = { id: ds.id, name: ds.name, info: ds.info, columns: ds.columns.map(c => ({ name: c.name, type: c.type, role: c.role, orig: c.name, calc: c.calc })), rows: ds.rows.map(r => r.slice()), calc: deepClone(ds.calc || []) };
    pageNo = 0; query = ''; dirty = false;
  };
  load(cur);

  const tabs = h('div', { class: 'dv-tabs', role: 'tablist' });
  const toolbar = h('div', { class: 'dv-toolbar' });
  const gridWrap = h('div', { class: 'dv-grid-wrap' });

  body.style.display = 'flex'; body.style.flexDirection = 'column'; body.style.padding = '0'; body.style.gap = '8px';
  body.append(tabs, toolbar, gridWrap);
  const pager = h('div', { class: 'pager grow' });
  const cancel = h('button', { class: 'btn', type: 'button', text: 'Cerrar' });
  const apply = h('button', { class: 'btn primary', type: 'button', text: 'Aplicar cambios', disabled: true });
  const m = openModal({ title: 'Datos', cls: 'wide', labelledIcon: 'database', body, foot: h('div', { class: 'modal-foot' }, pager, cancel, apply) });
  const markDirty = () => { dirty = true; apply.disabled = false; };

  const confirmDiscard = async () => !dirty || confirmDialog('Cambios sin aplicar', 'Hay cambios sin aplicar en este origen. ¿Descartarlos?', 'Descartar', true);
  cancel.addEventListener('click', async () => { if (await confirmDiscard()) m.close(); });
  apply.addEventListener('click', () => { applyWork(); });

  function drawTabs() {
    clear(tabs);
    for (const d of App.p.datasets) {
      const t = h('button', { class: 'tab', type: 'button', role: 'tab', 'aria-selected': d.id === work.id ? 'true' : 'false', text: d.name });
      t.addEventListener('click', async () => { if (d.id === work.id || !await confirmDiscard()) return; cur = d; load(d); drawAll(); });
      tabs.appendChild(t);
    }
  }
  function drawToolbar() {
    clear(toolbar);
    const name = inputEl(work.name, v => { work.name = v.slice(0, 80); markDirty(); }, { label: 'Nombre del origen', max: 80 });
    name.style.width = '220px';
    const search = inputEl(query, v => { query = v; pageNo = 0; drawGrid(); }, { type: 'search', placeholder: 'Buscar en los datos…', label: 'Buscar' });
    search.style.width = '220px';
    const btn = (ic, label, fn, cls = '') => { const b = h('button', { class: 'btn ' + cls, type: 'button' }, icon(ic, 15), label); b.addEventListener('click', fn); return b; };
    toolbar.append(name,

      btn('plus', 'Columna', () => {

  function visibleRows() {

    });

  function drawAll() { drawTabs(); drawToolbar(); drawGrid(); apply.disabled = !dirty; }

  function applyWork() {
    const names = new Set();
    for (const c of work.columns) {
      if (!c.name || names.has(c.name)) return toast('Los nombres de columna deben ser únicos y no estar vacíos', 'error');
      names.add(c.name);

    const ds = dsById(work.id);
    if (!ds) return;
    const rename = new Map();
    const typeChanged = new Set();
    for (const c of work.columns) {
      if (c.orig && c.orig !== c.name) rename.set(c.orig, c.name);
      const old = c.orig ? ds.columns.find(o => o.name === c.orig) : null;
      if (old && old.type !== c.type) typeChanged.add(c.name);
    }
    const map = n => (n != null && rename.has(n) ? rename.get(n) : n);
    const snap = snapshot();
    ds.name = work.name || ds.name;
    ds.columns = work.columns.map(c => ({ name: c.name, type: c.type, role: c.role, ...(c.calc ? { calc: c.calc } : null) }));
    ds.rows = work.rows;
    ds.calc = work.calc;

    delete ds._grainCache; delete ds._colorCache;
    for (const pg of App.p.pages) for (const w of pg.widgets) {

    }
    App.p.filters = App.p.filters.map(f => (f.ds === ds.id ? Object.assign({}, f, { field: map(f.field) }) : f)).filter(f => !(f.ds === ds.id && typeChanged.has(f.field)));
    pushHistory(snap);

  }
  /** Crea (id null) o edita una columna condicional sobre la copia de trabajo. */
  function editCalc(id) {
    openCalcBuilder(work, id, def => {
      const k = work.calc.findIndex(d => d.id === def.id);
      if (k < 0) {
        if (work.columns.length >= LIMITS.cols) return toast(`Se ha alcanzado el máximo de ${LIMITS.cols} columnas`, 'error');
        if (work.calc.length >= CALC_MAX.defs) return toast(`Máximo ${CALC_MAX.defs} columnas condicionales por origen`, 'error');
        work.calc.push(def);
        work.columns.push({ name: def.name, type: def.type, role: null, orig: null, calc: def.id });
        work.rows.forEach(r => r.push(null));
      } else {
        const col = work.columns.find(c => c.calc === def.id);

    });
  }
  function transpose() {
    const ds = dsById(work.id);
    if (!ds) return;
    if (dirty) return toast('Aplica o descarta los cambios antes de transponer', 'error');
    if (ds.rows.length > LIMITS.cols - 1) toast(`Solo se transponen las primeras ${LIMITS.cols - 1} filas`, 'info');
    const tr = transposeDataset(ds);

  }
  async function deleteDs() {
    const ds = dsById(work.id);
    if (!ds) return;
    const used = App.p.pages.reduce((a, pg) => a + pg.widgets.filter(w => w.ds === ds.id).length, 0);
    if (!await confirmDialog('Eliminar origen de datos', `¿Eliminar «${ds.name}»?` + (used ? ` ${used} visual(es) se quedarán sin datos.` : '') + ' Esta acción no se puede deshacer.', 'Eliminar', true)) return;
    App.p.datasets = App.p.datasets.filter(d => d !== ds);
    App.p.filters = App.p.filters.filter(f => f.ds !== ds.id);
    afterChange({});
    if (!App.p.datasets.length) return m.close();
    cur = App.p.datasets[0]; load(cur); drawAll();
  }

}

/* ---- 07b-palettes.js ---- */
/* ==========================================================================
   Paletas de color de la herramienta y del dashboard.
   Cada paleta define el cromo (barra superior, color principal, acento) y
   la serie categórica de 8 colores para claro y oscuro. Las paletas
   incluidas se han validado (contraste, separación para daltonismo y
   visión normal entre colores adyacentes). La personalizada se valida en vivo.
   ========================================================================== */

// Pasos validados de la paleta de referencia (azul, naranja, aqua, amarillo, magenta, verde, violeta, rojo)
const HUES_L = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];
const HUES_D = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];
function seriesFrom(lead, order) {
  return { light: [lead[0], ...order.map(i => HUES_L[i])], dark: [lead[1], ...order.map(i => HUES_D[i])] };
}
const PALETTES = {
  default: { name: '4Dash (predeterminada)', topbar: '#1b2130', primary: '#3a5ccc', brand: '#ff8a5b', ...seriesFrom(['#2a78d6', '#3987e5'], [1, 2, 3, 4, 5, 6, 7]) },
  emerald: { name: 'Verde esmeralda', topbar: '#047857', primary: '#047857', brand: '#ffffff', ...seriesFrom(['#059669', '#10a37a'], [1, 0, 3, 4, 6, 7, 5]) },
  electric: { name: 'Azul eléctrico', topbar: '#0047ff', primary: '#0050e6', brand: '#ffffff', ...seriesFrom(['#0062ff', '#3b82ff'], [1, 2, 3, 4, 5, 6, 7]) },
  navy: { name: 'Corporativo marino', topbar: '#1f2a44', primary: '#2f5597', brand: '#d4a72c', ...seriesFrom(['#2f5597', '#4a74c9'], [1, 2, 3, 4, 6, 5, 7]) },
  sunset: { name: 'Atardecer', topbar: '#7c2d12', primary: '#c2410c', brand: '#fdba74', ...seriesFrom(['#d9480f', '#e8590c'], [0, 2, 3, 4, 6, 5, 7]) },
  violet: { name: 'Violeta', topbar: '#3b0764', primary: '#6d28d9', brand: '#e9d5ff', ...seriesFrom(['#7c3aed', '#9b6cf2'], [2, 1, 0, 3, 4, 5, 7]) },
  graphite: { name: 'Grafito y cian', topbar: '#111827', primary: '#0e7490', brand: '#22d3ee', ...seriesFrom(['#0b7fa0', '#1597b5'], [1, 6, 3, 4, 5, 0, 7]) }
};
const HEX_RE = /^#[0-9a-f]{6}$/i;

/* ---------- Utilidades de color ---------- */
const hexToRgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
const rgbToHex = rgb => '#' + rgb.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
const mixHex = (a, b, t) => { const x = hexToRgb(a), y = hexToRgb(b); return rgbToHex(x.map((v, i) => v + (y[i] - v) * t)); };
const toLin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
function luminance(hex) { const [r, g, b] = hexToRgb(hex).map(toLin); return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
function contrast(a, b) { const x = luminance(a), y = luminance(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
const readableOn = bg => (contrast(bg, '#ffffff') >= contrast(bg, '#111111') ? '#ffffff' : '#111111');
function oklab([r, g, b]) {
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s];
}
// Simulación de daltonismo (Machado et al. 2009, severidad 1.0) en RGB lineal
const CVD = {
  protan: [[0.152286, 1.052583, -0.204868], [0.114503, 0.786281, 0.099216], [-0.003882, -0.048116, 1.051998]],
  deutan: [[0.367322, 0.860646, -0.227968], [0.280085, 0.672501, 0.047413], [-0.01182, 0.04294, 0.968881]]
};
function deltaE(a, b, sim) {
  const lin = hex => {
    const v = hexToRgb(hex).map(toLin);
    if (!sim) return v;
    return CVD[sim].map(row => clamp(row[0] * v[0] + row[1] * v[1] + row[2] * v[2], 0, 1));
  };
  const p = oklab(lin(a)), q = oklab(lin(b));
  return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]) * 100;
}
/** Comprobaciones de accesibilidad de una serie categórica y del color principal. */
function checkPalette(pal, surface = '#ffffff') {
  const out = [];
  const s = pal.series || pal.light;
  let worstN = Infinity, worstC = Infinity, pairN = null, pairC = null;
  for (let i = 0; i + 1 < s.length; i++) {
    const n = deltaE(s[i], s[i + 1]);
    const c = Math.min(deltaE(s[i], s[i + 1], 'protan'), deltaE(s[i], s[i + 1], 'deutan'));
    if (n < worstN) { worstN = n; pairN = [i, i + 1]; }
    if (c < worstC) { worstC = c; pairC = [i, i + 1]; }
  }
  out.push(worstN >= 15
    ? { level: 'ok', text: `Colores contiguos distinguibles (ΔE mínimo ${worstN.toFixed(1)}).` }
    : { level: 'bad', text: `Los colores ${pairN[0] + 1} y ${pairN[1] + 1} se parecen demasiado (ΔE ${worstN.toFixed(1)} < 15).` });
  out.push(worstC >= 8
    ? { level: 'ok', text: `Apta para daltonismo protan/deutan (ΔE mínimo ${worstC.toFixed(1)}).` }
    : worstC >= 6
      ? { level: 'warn', text: `Daltonismo: los colores ${pairC[0] + 1} y ${pairC[1] + 1} quedan justos (ΔE ${worstC.toFixed(1)}). Mantén etiquetas de datos activadas.` }
      : { level: 'bad', text: `Daltonismo: los colores ${pairC[0] + 1} y ${pairC[1] + 1} son casi iguales (ΔE ${worstC.toFixed(1)} < 6).` });
  const low = s.map((c, i) => [i + 1, contrast(c, surface)]).filter(x => x[1] < 3);
  out.push(!low.length
    ? { level: 'ok', text: 'Todos los colores tienen contraste ≥ 3:1 sobre el fondo.' }
    : { level: 'warn', text: `Contraste bajo sobre el fondo en los colores ${low.map(x => x[0]).join(', ')}: usa etiquetas de datos o la vista de tabla.` });
  const pc = contrast(pal.primary, '#ffffff');
  out.push(pc >= 4.5
    ? { level: 'ok', text: `Color principal legible en botones (contraste ${pc.toFixed(1)}:1).` }
    : { level: 'warn', text: `El color principal tiene poco contraste con texto blanco (${pc.toFixed(1)}:1 < 4,5:1).` });
  return out;
}

/* ---------- Aplicación ---------- */
function currentPalette() {
  const p = App.p && App.p.palette;
  if (p && p.id === 'custom' && p.custom) return Object.assign({ name: 'Personalizada' }, p.custom, { light: p.custom.series, dark: p.custom.series });
  return PALETTES[(p && PALETTES[p.id]) ? p.id : 'default'];
}
/** Aplica la paleta como variables CSS (CSSOM: compatible con la CSP). */
function applyPalette() {
  const pal = currentPalette();
  const dark = document.documentElement.dataset.theme === 'dark';
  const root = document.documentElement.style;
  const set = (k, v) => root.setProperty(k, v);
  const topFg = readableOn(pal.topbar);
  set('--topbar-bg', dark ? mixHex(pal.topbar, '#000000', 0.35) : pal.topbar);
  set('--topbar-fg', topFg);
  set('--topbar-fg-2', mixHex(topFg, pal.topbar, 0.3));
  set('--topbar-hover', mixHex(pal.topbar, topFg, 0.16));
  set('--brand', pal.brand);
  const top = dark ? mixHex(pal.topbar, '#000000', 0.35) : pal.topbar;
  set('--brand-top', contrast(pal.brand, top) >= 1.8 ? pal.brand : topFg);
  const pane = dark ? '#1f2430' : '#ffffff';
  const primary = dark ? mixHex(pal.primary, '#ffffff', luminance(pal.primary) < 0.2 ? 0.3 : 0.1) : pal.primary;
  set('--primary', primary);
  set('--primary-hover', mixHex(primary, dark ? '#ffffff' : '#000000', 0.12));
  set('--primary-fg', readableOn(primary));
  set('--primary-soft', mixHex(pane, primary, dark ? 0.28 : 0.13));
  set('--focus', primary);
  const segOn = contrast(primary, top) >= 1.8;
  set('--seg-on-bg', segOn ? primary : topFg);
  set('--seg-on-fg', segOn ? readableOn(primary) : top);
  set('--tab-accent', contrast(pal.brand, pane) >= 1.6 ? pal.brand : primary);
  const series = dark ? pal.dark : pal.light;
  series.forEach((c, i) => set(`--series-${i + 1}`, c));

function sanitizePalette(p) {
  if (!p || typeof p !== 'object') return { id: 'default' };
  if (p.id === 'custom' && p.custom && typeof p.custom === 'object') {
    const c = p.custom;
    const hx = (v, d) => (typeof v === 'string' && HEX_RE.test(v) ? v.toLowerCase() : d);
    const base = PALETTES.default;
    return {
      id: 'custom', custom: {
        topbar: hx(c.topbar, base.topbar), primary: hx(c.primary, base.primary), brand: hx(c.brand, base.brand),
        series: Array.from({ length: 8 }, (_, i) => hx(Array.isArray(c.series) ? c.series[i] : null, base.light[i]))
      }
    };
  }
  return { id: PALETTES[p.id] ? p.id : 'default' };
}

/* ---------- Diálogo de paletas ---------- */
function paletteSwatchRow(colors, cls = '') {

}

/* ---- 07c-integrity.js ---- */
/* ==========================================================================
   Comprobación de integridad en ejecución.
   La CSP del archivo solo permite ejecutar el script y aplicar los estilos
   cuyo SHA-256 coincide con el publicado en la propia CSP: si alguien altera
   el código sin actualizar los hashes, el navegador no lo ejecuta. Esta
   comprobación añade un aviso visible si la CSP falta o se ha modificado, o si
   el contenido no coincide con sus hashes (p. ej. un archivo dañado).
   Para verificar el archivo completo, compara su SHA-256 con el publicado
   (dist/4dash.html.sha256 en el repositorio).
   ========================================================================== */

const SELF_SCRIPT = document.currentScript;

async function sha256b64(text) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  let bin = '';
  for (const b of new Uint8Array(d)) bin += String.fromCharCode(b);
  return btoa(bin);
}
/** Devuelve { ok, items: [{ level: 'ok'|'warn'|'bad', text }] }. */
async function checkIntegrity() {
  const items = [];
  const meta = document.querySelector('meta[http-equiv="Content-Security-Policy"]');
  const csp = meta ? meta.getAttribute('content') || '' : '';
  const hashOf = dir => { const m = new RegExp(dir + " 'sha256-([A-Za-z0-9+/=]+)'").exec(csp); return m ? m[1] : null; };
  const wantScript = hashOf('script-src'), wantStyle = hashOf('style-src');
  if (!meta || !wantScript || !wantStyle || !/default-src 'none'/.test(csp)) {
    items.push({ level: 'bad', text: 'La política de seguridad (CSP) original falta o ha sido modificada: el archivo no es el publicado.' });
  } else {
    items.push({ level: 'ok', text: 'Política de seguridad (CSP) presente y restrictiva.' });
  }
  if (!(window.crypto && crypto.subtle)) {
    items.push({ level: 'warn', text: 'Este navegador no permite calcular SHA-256 aquí; no se pudo comprobar el código.' });
    return { ok: false, items };
  }
  const ownStyle = document.head.querySelector('style');
  try {
    if (wantScript && SELF_SCRIPT) {
      const got = await sha256b64(SELF_SCRIPT.textContent);
      items.push(got === wantScript
        ? { level: 'ok', text: 'El código coincide con su firma SHA-256.' }
        : { level: 'bad', text: 'El código no coincide con su firma SHA-256: el archivo está dañado o modificado.' });
    }
    if (wantStyle && ownStyle) {
      const got = await sha256b64(ownStyle.textContent);
      items.push(got === wantStyle
        ? { level: 'ok', text: 'Los estilos coinciden con su firma SHA-256.' }
        : { level: 'bad', text: 'Los estilos no coinciden con su firma SHA-256.' });
    }
  } catch {
    items.push({ level: 'warn', text: 'No se pudo calcular la firma del código en este navegador.' });
  }
  const extra = document.querySelectorAll('script').length - 1;
  if (extra > 0) items.push({ level: 'warn', text: `Hay ${extra} script(s) adicional(es) en la página (posible extensión del navegador o archivo modificado). La CSP impide que se ejecuten.` });
  return { ok: !items.some(i => i.level !== 'ok'), items };
}

function openAbout() {
  const version = (document.querySelector('meta[name="generator"]') || {}).content || '4Dash';
  const list = h('ul', { class: 'a11y-list' }, h('li', { class: 'a11y', text: 'Comprobando…' }));
  const body = h('div', { class: 'modal-body' },
    h('p', null, h('b', { text: version }), ' · © 2026 Vex62 · ', h('span', { text: 'Licencia 4Dash: uso libre; el uso comercial exige citar claramente al autor («Creado con 4Dash — © Vex62 (github.com/Vex62/4dash)»).' })),
    h('p', { class: 'hint', text: 'Funciona sin conexión: ningún dato sale de tu equipo. Iconos en parte basados en Feather Icons (MIT) y Lucide (ISC).' }),
    h('div', { class: 'section-title', text: 'Integridad del archivo' }), list,
    h('p', { class: 'hint', text: 'Para comprobar el archivo completo, calcula su SHA-256 y compáralo con el publicado junto a la versión (dist/4dash.html.sha256). En Windows: certutil -hashfile 4dash.html SHA256 · en macOS/Linux: shasum -a 256 4dash.html' }));
  const ok = h('button', { class: 'btn primary', type: 'button', text: 'Cerrar' });
  const m = openModal({ title: 'Acerca de 4Dash', labelledIcon: 'shield', body, foot: h('div', { class: 'modal-foot' }, ok) });
  ok.addEventListener('click', () => m.close());
  checkIntegrity().then(r => {
    clear(list);
    for (const it of r.items) list.appendChild(h('li', { class: 'a11y ' + it.level }, icon(it.level === 'ok' ? 'check' : 'info', 14), h('span', { text: it.text })));
  });
  return m;
}

/* ---- 07d-calc.js ---- */
/* ==========================================================================
   Columnas condicionales: reglas «Si … entonces …» que crean una columna
   nueva a partir de los datos cargados (similar a SI.CONJUNTO / CASE WHEN).
   Las definiciones se guardan en ds.calc y los valores se materializan en
   ds.rows, de modo que filtros, agregaciones y visuales los usan sin cambios.
   Sin eval ni new Function: las reglas se interpretan, nunca se ejecutan.
   ========================================================================== */

/* Definición:
   { id, name, type: 'text'|'number'|'date',
     rules: [{ all: true|false, conds: [{ col, op, a, b }], res }],
     other }
   Operando (a, b, res, other): { k: 'v', v: literal } | { k: 'c', v: nombreColumna } | { k: 'n' } (vacío) */
const CALC_MAX = { defs: 40, rules: 30, conds: 10 };
const CALC_OPS = {
  number: [
    ['eq', 'es igual a'], ['ne', 'no es igual a'], ['gt', 'es mayor que'], ['ge', 'es mayor o igual que'],
    ['lt', 'es menor que'], ['le', 'es menor o igual que'], ['between', 'está entre (incluidos)'], ['notBetween', 'no está entre'],
    ['empty', 'está vacío'], ['notEmpty', 'no está vacío']
  ],
  date: [
    ['eq', 'es el día'], ['ne', 'no es el día'], ['gt', 'es posterior a'], ['ge', 'es igual o posterior a'],
    ['lt', 'es anterior a'], ['le', 'es igual o anterior a'], ['between', 'está entre (incluidas)'], ['notBetween', 'no está entre'],
    ['year', 'es del año'], ['month', 'es del mes (1-12)'], ['lastDays', 'está en los últimos N días'],
    ['beforeToday', 'es anterior a hoy'], ['afterToday', 'es posterior a hoy'],
    ['empty', 'está vacío'], ['notEmpty', 'no está vacío']
  ],
  text: [
    ['eq', 'es igual a'], ['ne', 'no es igual a'], ['contains', 'contiene'], ['notContains', 'no contiene'],
    ['starts', 'empieza por'], ['ends', 'termina en'], ['in', 'es uno de (separados por ;)'],
    ['empty', 'está vacío'], ['notEmpty', 'no está vacío']
  ]
};
const CALC_ALL_OPS = new Set(Object.values(CALC_OPS).flat().map(o => o[0]));
/** Número de operandos de cada operador (por defecto, 1). */
const opArity = op => (['empty', 'notEmpty', 'beforeToday', 'afterToday'].includes(op) ? 0 : ['between', 'notBetween'].includes(op) ? 2 : 1);
/** Operadores cuyo operando es un número entero aunque la columna sea fecha, o una lista: solo admiten valor fijo. */
const opLiteralOnly = op => ['year', 'month', 'lastDays', 'in'].includes(op);
const opOperandType = (op, type) => (['year', 'month', 'lastDays'].includes(op) ? 'number' : type);
const NEGATED = { ne: 'eq', notBetween: 'between', notContains: 'contains' };

/** Normaliza texto para comparar: sin mayúsculas, acentos ni espacios sobrantes. */
function normText(v) {
  return String(v).normalize('NFD').replace(/[̀-ͯ]/g, '').toLocaleLowerCase(LOCALE).replace(/\s+/g, ' ').trim();
}
function todayIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function addDaysIso(iso, n) {
  const d = new Date(Date.parse(iso + 'T00:00:00Z') + n * 86400000);
  return d.toISOString().slice(0, 10);
}

/** Índice de columna usable por la definición k (no puede leer columnas condicionales posteriores ni a sí misma). */
function calcRefIdx(tbl, k, name) {
  const j = tbl.columns.findIndex(c => c.name === name);
  if (j < 0) return -1;
  const ref = tbl.columns[j].calc;
  if (ref) { const pos = tbl.calc.findIndex(d => d.id === ref); if (pos < 0 || pos >= k) return -1; }
  return j;
}

/** Devuelve una función (fila) -> valor. Las referencias inválidas hacen que la condición no se cumpla. */
function compileCalc(tbl, k) {
  const def = tbl.calc[k];
  const today = todayIso();
  const operand = (o, type) => {
    if (!o || o.k === 'n') return () => null;
    if (o.k === 'c') {
      const j = calcRefIdx(tbl, k, o.v);
      if (j < 0) return null;
      const src = tbl.columns[j].type;
      return src === type ? r => r[j] : r => convertValue(r[j], type);
    }
    const v = convertValue(o.v, type);
    return () => v;
  };
  const condFn = c => {
    const i = calcRefIdx(tbl, k, c.col);
    if (i < 0 || !CALC_ALL_OPS.has(c.op)) return () => false;
    const type = tbl.columns[i].type;
    const op = c.op;
    if (op === 'empty') return r => r[i] == null || r[i] === '';
    if (op === 'notEmpty') return r => !(r[i] == null || r[i] === '');
    if (NEGATED[op]) { const pos = condFn(Object.assign({}, c, { op: NEGATED[op] })); return r => !pos(r); }
    const ot = opOperandType(op, type);
    const fa = operand(c.a, ot), fb = opArity(op) === 2 ? operand(c.b, ot) : () => null;
    if (!fa || !fb) return () => false;
    if (type === 'number') {
      const cmp = { eq: (x, a) => x === a, gt: (x, a) => x > a, ge: (x, a) => x >= a, lt: (x, a) => x < a, le: (x, a) => x <= a }[op];
      if (op === 'between') return r => { const x = r[i], a = fa(r), b = fb(r); return x != null && a != null && b != null && x >= Math.min(a, b) && x <= Math.max(a, b); };
      if (!cmp) return () => false;
      return r => { const x = r[i], a = fa(r); return x != null && a != null && cmp(x, a); };
    }
    if (type === 'date') {
      const day = v => (typeof v === 'string' ? v.slice(0, 10) : null);
      if (op === 'beforeToday') return r => { const x = day(r[i]); return x != null && x < today; };
      if (op === 'afterToday') return r => { const x = day(r[i]); return x != null && x > today; };
      if (op === 'year') return r => { const x = day(r[i]), a = fa(r); return x != null && a != null && +x.slice(0, 4) === a; };
      if (op === 'month') return r => { const x = day(r[i]), a = fa(r); return x != null && a != null && +x.slice(5, 7) === a; };
      if (op === 'lastDays') return r => { const x = day(r[i]), a = fa(r); return x != null && a != null && x <= today && x >= addDaysIso(today, -Math.abs(Math.round(a))); };
      const cmp = { eq: (x, a) => x === a, gt: (x, a) => x > a, ge: (x, a) => x >= a, lt: (x, a) => x < a, le: (x, a) => x <= a }[op];
      if (op === 'between') return r => { const x = day(r[i]), a = day(fa(r)), b = day(fb(r)); return x != null && a != null && b != null && x >= (a < b ? a : b) && x <= (a < b ? b : a); };
      if (!cmp) return () => false;
      return r => { const x = day(r[i]), a = day(fa(r)); return x != null && a != null && cmp(x, a); };
    }
    // Texto: sin distinguir mayúsculas ni acentos
    if (op === 'in') {
      const set = new Set(String(c.a && c.a.v != null ? c.a.v : '').split(';').map(normText).filter(Boolean));
      return r => r[i] != null && set.has(normText(r[i]));
    }
    const test = { eq: (x, a) => x === a, contains: (x, a) => x.includes(a), starts: (x, a) => x.startsWith(a), ends: (x, a) => x.endsWith(a) }[op];
    if (!test) return () => false;
    return r => { const a = fa(r); return r[i] != null && a != null && test(normText(r[i]), normText(a)); };
  };
  const rules = def.rules.map(rule => {
    const conds = rule.conds.map(condFn);
    const res = operand(rule.res, def.type) || (() => null);
    const when = !conds.length ? () => false : rule.all ? r => conds.every(f => f(r)) : r => conds.some(f => f(r));
    return { when, res };
  });
  const other = operand(def.other, def.type) || (() => null);
  const fn = r => { for (const rl of rules) if (rl.when(r)) return rl.res(r); return other(r); };
  /** Variante que también indica qué regla se aplicó (-1 = «en otro caso»), para la vista previa. */
  fn.which = r => { for (let n = 0; n < rules.length; n++) if (rules[n].when(r)) return n; return -1; };
  return fn;
}

/**
 * Recalcula todas las columnas condicionales de una tabla ({columns, rows, calc}).
 * Crea las que falten y convierte en normales las columnas cuya definición ya no existe.
 */
function applyCalcColumns(tbl, onlyRows) {
  if (!Array.isArray(tbl.calc)) tbl.calc = [];
  const ids = new Set(tbl.calc.map(d => d.id));
  for (const c of tbl.columns) if (c.calc && !ids.has(c.calc)) delete c.calc;
  tbl.calc.forEach((def, k) => {
    let j = tbl.columns.findIndex(c => c.calc === def.id);
    if (j < 0) {
      if (tbl.columns.length >= LIMITS.cols) return;
      j = tbl.columns.length;
      tbl.columns.push({ name: def.name, type: def.type, role: null, calc: def.id });
      for (const r of tbl.rows) r.push(null);
    }
    Object.assign(tbl.columns[j], { name: def.name, type: def.type });
    const fn = compileCalc(tbl, k);
    for (const r of onlyRows || tbl.rows) r[j] = fn(r);
  });
}
/** Actualiza las referencias a una columna renombrada dentro de las definiciones. */
function renameCalcRefs(calc, from, to) {
  const fix = o => { if (o && o.k === 'c' && o.v === from) o.v = to; };
  for (const d of calc || []) {
    for (const rl of d.rules) { fix(rl.res); for (const c of rl.conds) { if (c.col === from) c.col = to; fix(c.a); fix(c.b); } }
    fix(d.other);
  }
}
/** Nombres de las definiciones que usan una columna. */
function calcUsersOf(calc, name, exceptId) {
  const uses = o => o && o.k === 'c' && o.v === name;
  return (calc || []).filter(d => d.id !== exceptId && (uses(d.other) || d.rules.some(rl => uses(rl.res) || rl.conds.some(c => c.col === name || uses(c.a) || uses(c.b))))).map(d => d.name);
}

/* ---------- Saneado (proyectos abiertos desde archivo o autoguardado) ---------- */
function sanitizeCalc(list) {
  if (!Array.isArray(list)) return [];
  const field = v => (typeof v === 'string' && v.length <= 80 ? v : null);
  const operandOf = o => {
    if (!o || typeof o !== 'object') return { k: 'n' };
    if (o.k === 'c') return field(o.v) ? { k: 'c', v: o.v } : { k: 'n' };
    if (o.k === 'v') return typeof o.v === 'number' && isFinite(o.v) ? { k: 'v', v: o.v } : typeof o.v === 'string' ? { k: 'v', v: o.v.slice(0, 2000) } : { k: 'n' };
    return { k: 'n' };
  };
  const ids = new Set();
  return list.slice(0, CALC_MAX.defs).map(d => {
    if (!d || typeof d !== 'object' || !field(d.name) || !Array.isArray(d.rules)) return null;
    const id = ID_RE.test(d.id) && !ids.has(d.id) ? d.id : uid();
    ids.add(id);
    return {
      id, name: d.name.trim().slice(0, 80) || 'Columna condicional', type: oneOf(d.type, ['text', 'number', 'date'], 'text'),
      rules: d.rules.slice(0, CALC_MAX.rules).filter(rl => rl && Array.isArray(rl.conds)).map(rl => ({
        all: bool(rl.all, true),
        conds: rl.conds.slice(0, CALC_MAX.conds).filter(c => c && field(c.col) && CALC_ALL_OPS.has(c.op)).map(c => ({ col: c.col, op: c.op, a: operandOf(c.a), b: operandOf(c.b) })),
        res: operandOf(rl.res)
      })),
      other: operandOf(d.other)
    };
  }).filter(Boolean);
}

/* ---------- Constructor visual de reglas ---------- */
const CALC_TYPES = [['text', 'Texto'], ['number', 'Número'], ['date', 'Fecha']];
function blankCond(col) { return { col: col ? col.name : null, op: col ? CALC_OPS[col.type][0][0] : 'eq', a: { k: 'v', v: null }, b: { k: 'v', v: null } }; }

/**
 * Abre el editor de una columna condicional sobre una tabla de trabajo ({columns, rows, calc}).
 * onSave(def) recibe la definición validada; no modifica la tabla.
 */
function openCalcBuilder(tbl, calcId, onSave) {
  const k0 = calcId ? tbl.calc.findIndex(d => d.id === calcId) : tbl.calc.length;
  const def = calcId ? deepClone(tbl.calc[k0]) : null;
  // Columnas que la regla puede leer: las normales y las condicionales definidas antes que esta
  const usable = tbl.columns.filter(c => !c.calc || tbl.calc.findIndex(d => d.id === c.calc) < k0);
  const colByName = n => usable.find(c => c.name === n) || null;
  if (!usable.length) { toast('El origen no tiene columnas que se puedan usar en una condición', 'error'); return null; }
  let draft = def || {
    id: uid(), name: '', type: 'text',
    rules: [{ all: true, conds: [blankCond(usable.find(c => c.type === 'date') || usable[0])], res: { k: 'v', v: null } }],
    other: { k: 'n' }
  };
  if (!draft.name) { let n = 'Condicional', i = 1; while (tbl.columns.some(c => c.name === n)) n = `Condicional ${++i}`; draft.name = n; }

  const body = h('div', { class: 'modal-body calc-body' });
  const preview = h('div', { class: 'calc-preview' });
  const cancel = h('button', { class: 'btn', type: 'button', text: 'Cancelar' });
  const save = h('button', { class: 'btn primary', type: 'button', text: calcId ? 'Guardar cambios' : 'Crear columna' });
  const m = openModal({ title: calcId ? 'Editar columna condicional' : 'Nueva columna condicional', cls: 'calc-modal', labelledIcon: 'branch', body, foot: h('div', { class: 'modal-foot' }, cancel, save) });
  cancel.addEventListener('click', () => m.close());
  save.addEventListener('click', () => {
    const err = validate();
    if (err) { toast(err, 'error'); draw(); return; }
    m.close();
    onSave(clean(draft));
  });

  const refreshPreview = debounce(drawPreview, 150);
  /** Redibuja conservando el foco (los controles llevan una clave estable en data-k). */
  function draw() {
    const fk = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
    clear(body);
    body.append(...drawHead(), ...drawRules(), drawOther(), preview);
    drawPreview();
    if (fk) { const el = body.querySelector(`[data-k="${fk}"]`); if (el) el.focus(); }
  }
  const keyed = (el, key) => { el.dataset.k = key; return el; };
  const btn = (ic, label, fn, key, cls = 'icon-btn') => {
    const b = keyed(h('button', { class: cls, type: 'button', title: label, 'aria-label': label }, icon(ic, 15), cls === 'icon-btn' ? null : label), key);
    b.addEventListener('click', fn);
    return b;
  };

  function drawHead() {
    const name = keyed(inputEl(draft.name, v => { draft.name = v.replace(/\s+/g, ' ').slice(0, 80); }, { label: 'Nombre de la columna', max: 80 }), 'name');
    const type = keyed(selectEl(CALC_TYPES, draft.type, v => {
      draft.type = v;
      // Los valores fijos de resultado se reinterpretan con el nuevo tipo
      for (const o of [...draft.rules.map(r => r.res), draft.other]) if (o.k === 'v') o.v = o.v == null ? null : convertValue(o.v, v);
      draw();
    }, { label: 'Tipo de resultado' }), 'type');
    return [
      h('div', { class: 'form-inline calc-head' }, formRow('Nombre de la nueva columna', name), formRow('Tipo de resultado', type)),
      h('p', { class: 'hint', text: 'Las reglas se comprueban en orden, de arriba abajo: cada fila toma el resultado de la primera regla que cumple. Si no cumple ninguna, se usa «En otro caso». Los textos se comparan sin distinguir mayúsculas ni acentos; las fechas, por día.' })
    ];
  }

  function drawRules() {
    const out = [];
    draft.rules.forEach((rule, ri) => {
      const head = h('div', { class: 'calc-rule-head' },
        h('span', { class: 'calc-badge', text: ri === 0 ? 'SI' : 'SI NO, SI' }),
        h('span', { class: 'lbl', text: 'se cumplen' }),
        keyed(selectEl([['all', 'todas las condiciones (Y)'], ['any', 'alguna condición (O)']], rule.all ? 'all' : 'any', v => { rule.all = v === 'all'; refreshPreview(); }, { label: `Regla ${ri + 1}: tipo de combinación` }), `r${ri}all`),
        h('span', { class: 'grow' }),
        btn('chevU', 'Subir regla', () => { draft.rules.splice(ri - 1, 0, draft.rules.splice(ri, 1)[0]); draw(); }, `r${ri}up`),
        btn('chevD', 'Bajar regla', () => { draft.rules.splice(ri + 1, 0, draft.rules.splice(ri, 1)[0]); draw(); }, `r${ri}down`),
        btn('trash', 'Eliminar regla', () => { draft.rules.splice(ri, 1); draw(); }, `r${ri}del`));
      head.querySelector(`[data-k="r${ri}up"]`).disabled = ri === 0;
      head.querySelector(`[data-k="r${ri}down"]`).disabled = ri === draft.rules.length - 1;
      const conds = h('div', { class: 'calc-conds' });
      rule.conds.forEach((c, ci) => conds.appendChild(drawCond(rule, c, ri, ci)));
      const addCond = btn('plus', 'Añadir condición', () => { rule.conds.push(blankCond(colByName(rule.conds.length ? rule.conds[rule.conds.length - 1].col : null) || usable[0])); draw(); }, `r${ri}addc`, 'btn subtle');
      addCond.disabled = rule.conds.length >= CALC_MAX.conds;
      const then = h('div', { class: 'calc-then' }, h('span', { class: 'calc-badge then', text: 'ENTONCES' }), ...operandEditor(rule.res, draft.type, `r${ri}res`, { label: `Resultado de la regla ${ri + 1}`, empty: true }));
      out.push(h('section', { class: 'calc-rule', 'aria-label': `Regla ${ri + 1}` }, head, conds, addCond, then));
    });
    const add = btn('plus', 'Añadir regla', () => { draft.rules.push({ all: true, conds: [blankCond(usable[0])], res: { k: 'v', v: null } }); draw(); }, 'addrule', 'btn');
    add.disabled = draft.rules.length >= CALC_MAX.rules;
    out.push(add);
    return out;
  }

  function drawCond(rule, c, ri, ci) {
    const key = `r${ri}c${ci}`;
    const col = colByName(c.col);
    const colSel = keyed(selectEl([[null, 'Elige una columna…'], ...usable.map(u => [u.name, `${u.name} (${typeLabel(u)})`])], c.col, v => {
      const nc = colByName(v);
      const prevType = col ? col.type : null;
      c.col = v;
      if (nc && nc.type !== prevType) Object.assign(c, blankCond(nc));
      draw();
    }, { label: 'Columna' }), key + 'col');
    if (c.col && !col) colSel.classList.add('invalid');
    const parts = [colSel];
    if (col) {
      const ops = CALC_OPS[col.type];
      if (!ops.some(o => o[0] === c.op)) c.op = ops[0][0];
      parts.push(keyed(selectEl(ops, c.op, v => { const ot = opOperandType(c.op, col.type); c.op = v; if (opOperandType(v, col.type) !== ot || opLiteralOnly(v)) { c.a = { k: 'v', v: null }; c.b = { k: 'v', v: null }; } draw(); }, { label: 'Operador' }), key + 'op'));
      const ar = opArity(c.op), ot = opOperandType(c.op, col.type);
      const lit = opLiteralOnly(c.op);
      if (ar >= 1) parts.push(...operandEditor(c.a, ot, key + 'a', { label: ar === 2 ? 'Desde' : 'Valor', literalOnly: lit, placeholder: c.op === 'in' ? 'Norte; Sur; Este' : null, int: ['year', 'month', 'lastDays'].includes(c.op) }));
      if (ar === 2) parts.push(h('span', { class: 'lbl', text: 'y' }), ...operandEditor(c.b, ot, key + 'b', { label: 'Hasta' }));
    }
    const del = btn('close', 'Quitar condición', () => { rule.conds.splice(ci, 1); draw(); }, key + 'del');
    return h('div', { class: 'calc-cond' }, h('span', { class: 'calc-join', text: ci === 0 ? '' : rule.all ? 'Y' : 'O' }), h('div', { class: 'calc-cond-fields' }, ...parts), del);
  }

  /** Editor de un operando: [Valor fijo | Columna X | (vacío)] + control del valor. */
  function operandEditor(o, type, key, opts = {}) {
    const choices = [['v', opts.empty ? 'Valor fijo' : 'Valor']];
    if (opts.empty) choices.push(['n', '(Vacío)']);
    if (!opts.literalOnly) for (const u of usable) choices.push(['c:' + u.name, 'Columna: ' + u.name]);
    const cur = o.k === 'c' ? 'c:' + o.v : o.k;
    const src = keyed(selectEl(choices, cur, v => {
      if (v === 'v') Object.assign(o, { k: 'v', v: null });
      else if (v === 'n') { o.k = 'n'; delete o.v; }
      else Object.assign(o, { k: 'c', v: v.slice(2) });
      draw();
    }, { label: (opts.label || 'Valor') + ': origen' }), key + 'src');
    src.classList.add('calc-src');
    if (o.k === 'c' && !colByName(o.v)) src.classList.add('invalid');
    if (o.k !== 'v') return [src];
    return [src, literalInput(o, type, key, opts)];
  }
  function literalInput(o, type, key, opts) {
    const label = opts.label || 'Valor';
    if (type === 'date') {
      const inp = keyed(h('input', { class: 'inp', type: 'date', 'aria-label': label }), key + 'v');
      inp.value = typeof o.v === 'string' ? o.v.slice(0, 10) : '';
      inp.addEventListener('input', () => { o.v = ISO_RE.test(inp.value) ? inp.value : null; refreshPreview(); });
      return inp;
    }
    if (type === 'number') {
      const inp = keyed(inputEl(o.v == null ? '' : String(o.v).replace('.', ','), v => {
        const n = v.trim() === '' ? null : opts.int ? (/^-?\d+$/.test(v.trim()) ? +v.trim() : null) : parseNumberStr(v, true);
        inp.classList.toggle('invalid', v.trim() !== '' && n == null);
        o.v = n; refreshPreview();
      }, { label, placeholder: opts.int ? 'p. ej. 2025' : '0', max: 40 }), key + 'v');
      inp.setAttribute('inputmode', opts.int ? 'numeric' : 'decimal');
      return inp;
    }
    return keyed(inputEl(o.v == null ? '' : String(o.v), v => { o.v = v === '' ? null : v.slice(0, 2000); refreshPreview(); }, { label, placeholder: opts.placeholder || 'Texto', max: 2000 }), key + 'v');
  }

  function drawOther() {
    return h('div', { class: 'calc-then calc-other' }, h('span', { class: 'calc-badge then', text: 'EN OTRO CASO' }),
      ...operandEditor(draft.other, draft.type, 'other', { label: 'Resultado en otro caso', empty: true }));
  }

  /** Vista previa: recuento por regla y primeras filas con las columnas implicadas. */
  function drawPreview() {
    clear(preview);
    if (validate(true)) { preview.appendChild(h('p', { class: 'hint', text: 'Completa las condiciones para ver la vista previa.' })); return; }
    const d = clean(draft);
    const tmp = { columns: tbl.columns, rows: tbl.rows, calc: tbl.calc.slice(0, k0).concat([d]) };
    const fn = compileCalc(tmp, k0);
    const counts = new Array(d.rules.length).fill(0);
    let other = 0;
    // Muestra: hasta 5 filas que cumplen alguna regla y el resto, hasta 8, que no
    const hit = [], miss = [];
    for (const r of tbl.rows) {
      const n = fn.which(r);
      if (n < 0) { other++; if (miss.length < 8) miss.push(r); } else { counts[n]++; if (hit.length < 8) hit.push(r); }
    }
    const sample = hit.slice(0, Math.max(5, 8 - miss.length)).concat(miss).slice(0, 8);
    preview.appendChild(h('div', { class: 'section-title', text: 'Vista previa' }));
    const total = tbl.rows.length || 1;
    preview.appendChild(h('ul', { class: 'calc-counts' },
      ...counts.map((c, n) => h('li', null, h('b', { text: `Regla ${n + 1}: ` }), `${fmtNum(c)} filas (${fmtNum(c / total, 'percent')})`)),
      h('li', null, h('b', { text: 'En otro caso: ' }), `${fmtNum(other)} filas (${fmtNum(other / total, 'percent')})`)));
    const refs = [];
    for (const rl of d.rules) for (const c of rl.conds) { refs.push(c.col); for (const o of [c.a, c.b]) if (o && o.k === 'c') refs.push(o.v); }
    const cols = Array.from(new Set(refs)).map(n => tbl.columns.findIndex(c => c.name === n)).filter(j => j >= 0).slice(0, 5);
    const table = h('table', { class: 'calc-sample' });
    table.appendChild(h('thead', null, h('tr', null, ...cols.map(j => h('th', { text: tbl.columns[j].name })), h('th', { class: 'res', text: d.name || 'Resultado' }))));
    const tb = h('tbody');
    const show = (v, t) => (v == null ? '' : t === 'number' ? fmtNum(v) : t === 'date' ? fmtDateKey(v) : String(v));
    for (const r of sample) tb.appendChild(h('tr', null, ...cols.map(j => h('td', { text: show(r[j], tbl.columns[j].type) })), h('td', { class: 'res', text: show(fn(r), d.type) })));
    table.appendChild(tb);
    preview.appendChild(h('div', { class: 'calc-sample-wrap' }, table));
  }

  /** Copia limpia de la definición (sin valores de operandos que el operador no usa). */
  function clean(d) {
    const o = deepClone(d);
    o.name = o.name.trim();
    for (const rl of o.rules) for (const c of rl.conds) {
      const ar = opArity(c.op);
      if (ar < 1) c.a = { k: 'n' };
      if (ar < 2) c.b = { k: 'n' };
    }
    return o;
  }
  function validate(quiet) {
    const name = draft.name.trim();
    if (!name) return 'Escribe un nombre para la columna.';
    if (tbl.columns.some(c => c.name === name && c.calc !== draft.id)) return `Ya existe una columna llamada «${name}».`;
    if (!draft.rules.length) return 'Añade al menos una regla.';
    for (let ri = 0; ri < draft.rules.length; ri++) {
      const rl = draft.rules[ri];
      if (!rl.conds.length) return `La regla ${ri + 1} no tiene condiciones.`;
      for (const c of rl.conds) {
        const col = colByName(c.col);
        if (!col) return `Elige una columna en todas las condiciones de la regla ${ri + 1}.`;
        const ar = opArity(c.op);
        for (const o of [c.a, c.b].slice(0, ar)) {
          if (o.k === 'c' && !colByName(o.v)) return `La regla ${ri + 1} usa una columna que no existe.`;
          if (o.k !== 'c' && (o.v == null || o.v === '')) return `Falta un valor en la regla ${ri + 1} (${c.col}).`;
        }
        if (c.op === 'month' && !(c.a.v >= 1 && c.a.v <= 12)) return `El mes de la regla ${ri + 1} debe estar entre 1 y 12.`;
      }
      if (rl.res.k === 'c' && !colByName(rl.res.v)) return `El resultado de la regla ${ri + 1} usa una columna que no existe.`;
      if (rl.res.k === 'v' && (rl.res.v == null || rl.res.v === '') && !quiet) return `Indica el resultado de la regla ${ri + 1} (o elige «(Vacío)»).`;
    }
    if (draft.other.k === 'c' && !colByName(draft.other.v)) return 'El resultado «En otro caso» usa una columna que no existe.';
    if (draft.other.k === 'v' && (draft.other.v == null || draft.other.v === '') && !quiet) return 'Indica el resultado «En otro caso» (o elige «(Vacío)»).';
    return null;
  }
  draw();
  return m;
}

/* ---- 08-boot.js ---- */
/* ==========================================================================
   Arranque y eventos globales.
   ========================================================================== */

function renderAll() {
  renderTopbar(); renderToolbar(); renderLeft(); renderRight(); renderPages(); renderFilterBar(); renderCanvas(); renderStatus(); renderSaveState();
}
const isTyping = t => t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));

function bindEvents() {
  const title = $('#docTitle');
  title.addEventListener('input', () => mutateTyping(() => { App.p.title = title.value.slice(0, 120); }, { keepProps: true }));
  title.addEventListener('keydown', e => { if (e.key === 'Enter') title.blur(); });
  $('#themeBtn').addEventListener('click', () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
  $('#helpBtn').addEventListener('click', () => openTutorial());
  $('#paletteBtn').addEventListener('click', openPaletteDialog);

  $('#fileInput').addEventListener('change', e => { const f = e.target.files[0]; if (f) handleImport(f); });
  $('#projectInput').addEventListener('change', e => openProjectFile(e.target.files[0]));
  $('#imageInput').addEventListener('change', async e => {
    const f = e.target.files[0];
    const cb = imageCallback;
    imageCallback = null;
    if (!f || !cb) return;
    try { cb.cb(await sanitizeImageFile(f, cb.maxDim)); renderLogo(); if (App.view === 'presenter') renderPresHeader(); }
    catch (err) { reportError(err); }
  });

  // Arrastrar y soltar: archivos, visuales y campos sobre el lienzo
  const area = $('#canvasArea');
  let overlay = null, dragDepth = 0;
  const hasFiles = e => Array.from(e.dataTransfer.types || []).includes('Files');
  area.addEventListener('dragenter', e => {
    if (App.view !== 'editor' || !hasFiles(e)) return;
    dragDepth++;
    if (!overlay) { overlay = h('div', { class: 'drop-overlay', text: 'Suelta aquí tu Excel o CSV' }); area.appendChild(overlay); }
  });
  area.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth && overlay) { overlay.remove(); overlay = null; } });
  area.addEventListener('dragover', e => {
    if (App.view !== 'editor') return;
    const t = Array.from(e.dataTransfer.types || []);
    if (t.includes('Files') || t.includes('application/x-4dash-viz') || t.includes('application/x-4dash-field')) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }
  });
  area.addEventListener('drop', e => {
    if (App.view !== 'editor') return;
    e.preventDefault();
    dragDepth = 0;
    if (overlay) { overlay.remove(); overlay = null; }
    const r = $('#page').getBoundingClientRect();
    const at = { x: (e.clientX - r.left) / App.scale, y: (e.clientY - r.top) / App.scale };
    const inside = at.x >= 0 && at.y >= 0 && at.x <= page().w && at.y <= page().h;
    if (hasFiles(e)) { const f = e.dataTransfer.files[0]; if (f) handleImport(f); return; }
    const viz = e.dataTransfer.getData('application/x-4dash-viz');
    if (viz === 'shape') return insertShape('round', inside ? at : null);
    if (viz && VIZ[viz]) return insertWidget(viz, inside ? at : null);
    const field = e.dataTransfer.getData('application/x-4dash-field');
    if (field) { try { const f = safeJsonParse(field); createFromField(f.ds, String(f.col), inside ? at : null); } catch { /* ignorar */ } }
  });
  // Evitar que soltar un archivo fuera del lienzo lo abra en el navegador
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', e => { if (hasFiles(e)) e.preventDefault(); });

  // Clic en zona vacía: deseleccionar
  $('#scroller').addEventListener('pointerdown', e => {
    if (App.view === 'editor' && (e.target.id === 'page' || e.target.id === 'scroller' || e.target.id === 'pageFrame') && App.sel) select(null);
  });

  // Ctrl + rueda sobre el lienzo: zoom del lienzo (no el del navegador)
  $('#scroller').addEventListener('wheel', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1 : -1);
  }, { passive: false });
  // Al cambiar el ancho (ventana o zoom del navegador) se reparte de nuevo la barra de herramientas
  let tbWidth = 0, tbRaf = 0;
  new ResizeObserver(([en]) => {
    const wNow = Math.round(en.contentRect.width);
    if (wNow === tbWidth) return;
    tbWidth = wNow;
    cancelAnimationFrame(tbRaf);
    tbRaf = requestAnimationFrame(() => { if (App.view === 'editor') renderToolbar(); });
  }).observe($('#toolbar'));

  let zoomRaf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(zoomRaf); zoomRaf = requestAnimationFrame(applyZoom); }).observe($('#scroller'));
  document.addEventListener('fullscreenchange', () => { document.body.classList.toggle('is-fullscreen', !!document.fullscreenElement); requestAnimationFrame(applyZoom); });
  window.addEventListener('scroll', () => Tip.hide(), true);

  document.addEventListener('keydown', onKey);
  window.addEventListener('beforeunload', e => { if (!App.prefs.autosave && App.hist.length) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('error', e => { console.error(e.error || e.message); });
  window.addEventListener('unhandledrejection', e => { reportError(e.reason); });
}

function onKey(e) {
  const ctrl = e.ctrlKey || e.metaKey;
  const k = e.key;
  if (k === 'Escape') {
    if (openMenuEl) { closeMenu(); return; }
    if (tbOverflowEl) { closeToolbarOverflow(); $('#toolbar .tb-more')?.focus(); return; }
    if (modalStack.length) { modalStack[modalStack.length - 1].close(); return; }
    if (App.view === 'presenter' && !document.fullscreenElement) { setView('editor'); return; }
    if (App.sel) { select(null); return; }
    return;
  }
  if (modalStack.length) return;
  if (k === 'F1') { e.preventDefault(); openTutorial(); return; }
  if (k === 'F5') { e.preventDefault(); setView(App.view === 'editor' ? 'presenter' : 'editor'); return; }
  if (ctrl && k.toLowerCase() === 's') { e.preventDefault(); saveProjectFile(); return; }
  if (ctrl && k.toLowerCase() === 'o') { e.preventDefault(); openProjectPicker(); return; }
  if (ctrl && k.toLowerCase() === 'p') { e.preventDefault(); printDashboard(); return; }
  if (ctrl && k.toLowerCase() === 'e') { e.preventDefault(); openExportDialog(); return; }
  if (isTyping(e.target)) return;
  if (App.view === 'presenter') {
    const idx = App.p.pages.findIndex(p => p.id === App.p.active);
    if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); gotoPage(idx + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); gotoPage(idx - 1); }
    else if (k.toLowerCase() === 'f') toggleFullscreen();
    return;
  }
  if (ctrl && k.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if (ctrl && (k.toLowerCase() === 'y' || (k.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
  const w = selW();
  if (!w) return;
  if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); deleteSelected(); }
  else if (ctrl && k.toLowerCase() === 'd') { e.preventDefault(); duplicateSelected(); }
  else if (ctrl && k.toLowerCase() === 'c') { App.clipboard = JSON.stringify(w, jsonReplacer); toast('Visual copiado'); }
  else if (k.startsWith('Arrow')) {
    e.preventDefault();
    const st = e.shiftKey ? 10 : 1;
    nudge(k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0, k === 'ArrowUp' ? -st : k === 'ArrowDown' ? st : 0);
  }
}
document.addEventListener('keydown', e => {
  const ctrl = e.ctrlKey || e.metaKey;
  if (!ctrl || e.key.toLowerCase() !== 'v' || isTyping(e.target) || App.view !== 'editor' || !App.clipboard || modalStack.length) return;
  e.preventDefault();
  const w = sanitizeWidget(safeJsonParse(App.clipboard));
  if (!w) return;
  const pg = page();
  w.id = uid();
  w.x = clamp(w.x + 24, 0, Math.max(0, pg.w - w.w));
  w.y = clamp(w.y + 24, 0, Math.max(0, pg.h - w.h));
  if (w.ds && !dsById(w.ds)) w.ds = null;
  mutate(() => { pg.widgets.push(w); App.sel = w.id; });
});

function boot() {
  loadPrefs();
  const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = App.prefs.theme || (dark ? 'dark' : 'light');
  App.p = (App.prefs.autosave && loadStored()) || newProject();
  bindEvents();
  applyPalette();
  renderAll();
  checkIntegrity().then(r => {
    App.integrity = r;
    const bad = r.items.find(i => i.level === 'bad');
    if (bad) toast('Comprobación de integridad: ' + bad.text, 'error', 12000);
  }).catch(() => { /* sin API criptográfica: se informa en «Acerca de» */ });
  if (window.top !== window.self) {
    toast('Aviso: 4Dash se está mostrando dentro de otra página. Ábrelo directamente para mayor seguridad.', 'error', 9000);
  }
  if (!App.prefs.tutorialSeen) {
    App.prefs.tutorialSeen = true;
    savePrefs();
    setTimeout(() => openTutorial(), 300);
  }
}
boot();

})();</script>
